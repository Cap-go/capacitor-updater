appId: app.capgo.updater
---
# E2E summary is a single pinned line; one regex proves the full live-update state (faster
# and more reliable than long scrollUntilVisible chains on macOS runners).
- launchApp:
    arguments:
      isE2E: true
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 120000
- extendedWaitUntil:
    visible: '.*Harness: ready${BUILD_LABEL}${SCENARIO_LINE}${DIRECT_UPDATE_LINE}${AUTO_UPDATE_ENABLED_LINE}${AUTO_UPDATE_AVAILABLE_LINE}${NOTIFY_READY_LINE}${CURRENT_SOURCE_LINE}${CURRENT_VERSION_LINE}'
    timeout: 120000
