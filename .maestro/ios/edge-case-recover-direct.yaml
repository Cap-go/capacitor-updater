appId: app.capgo.updater
---
# One Maestro run per edge case: every extra run pays the XCTest driver startup again, which a
# hosted macOS runner cannot afford inside the 10 minute job cap.
- runFlow:
    file: edge-case-wait-summary.yaml
    env:
      SUMMARY_PATTERN: '${BUILTIN_PATTERN}'
- runScript:
    file: edge-case-clear-faults.js
    env:
      HOST_SERVER_URL: '${HOST_SERVER_URL}'
      SCENARIO_ID: '${SCENARIO_ID}'
# Recovery can install immediately or queue the release if the launch splash deadline expires.
- runFlow: ../helpers/cold-launch-app.yaml
# Wait for the launch transition before XCTest queries the app hierarchy.
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: '${APPLIED_PATTERN}|${DOWNLOADED_PATTERN}'
    timeout: '${CAPGO_MAESTRO_SUMMARY_WAIT_MS || 180000}'
- runFlow:
    when:
      visible: '${DOWNLOADED_PATTERN}'
    commands:
      - pressKey: Home
      - launchApp
      - waitForAnimationToEnd:
          timeout: 5000
# Both paths must finish on the downloaded release with notifyAppReady acknowledged.
- runFlow:
    file: edge-case-wait-summary.yaml
    env:
      SUMMARY_PATTERN: '${APPLIED_PATTERN}'
