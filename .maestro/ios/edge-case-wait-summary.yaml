appId: app.capgo.updater
---
# Attaches to the already running app (no launchApp) so edge case runners keep full control over
# kills, cold launches and background cycles. The E2E summary line is pinned at the top of the
# screen and holds every field in one element, so a single regex proves one consistent state.
# SUMMARY_PATTERN already starts with Harness: ready, so one wait keeps the flow inside its cap.
- extendedWaitUntil:
    visible: '${SUMMARY_PATTERN}'
    timeout: '${CAPGO_MAESTRO_SUMMARY_WAIT_MS}'
