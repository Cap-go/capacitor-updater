appId: app.capgo.updater
---
- launchApp:
    arguments:
      isE2E: true
- extendedWaitUntil:
    visible: 'CAPGO OTA VALIDATION'
    timeout: 180000
- pressKey: home
- launchApp:
    arguments:
      isE2E: true
- extendedWaitUntil:
    visible: 'CAPGO OTA VALIDATION'
    timeout: 180000
- scrollUntilVisible:
    element:
      text: 'Current bundle source: downloaded'
    direction: DOWN
    speed: 80
    timeout: 180000
- assertVisible: 'Current bundle source: downloaded'
- scrollUntilVisible:
    element:
      text: 'Current bundle version: native-reset-live'
    direction: DOWN
    speed: 80
    timeout: 180000
- assertVisible: 'Current bundle version: native-reset-live'
