appId: app.capgo.updater
---
- launchApp:
    arguments:
      isE2E: true
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 180000
- assertVisible: '@capgo/capacitor-updater'
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    speed: 80
    timeout: 120000
- openLink: capgo-maestro://focus-text/Quick%20apply%20runtime%20URLs
- tapOn:
    text: 'Quick apply runtime URLs'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*(Marker: set-runtime-urls:success|M:set-runtime-urls:success).*'
    timeout: 30000
- openLink: capgo-maestro://focus-text/Quick%20reset%20release
- tapOn:
    text: 'Quick reset release'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*(Marker: reset:success|M:reset:success).*'
    timeout: 30000
- openLink: capgo-maestro://focus-text/Quick%20download%20latest%20bundle
- tapOn:
    text: 'Quick download latest bundle'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*(Marker: download:success|M:download:success).*'
    timeout: 120000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    speed: 80
    timeout: 120000
- openLink: capgo-maestro://focus-text/Quick%20queue%20bundle
- tapOn:
    text: 'Quick queue bundle'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*(Marker: queue:success|M:queue:success).*'
    timeout: 30000
- extendedWaitUntil:
    visible: '.*Set next event: manual-manifest-v1.*'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    speed: 80
    timeout: 120000
- openLink: capgo-maestro://focus-text/Quick%20reload%20app
- tapOn:
    text: 'Quick reload app'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 180000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    speed: 80
    timeout: 120000
- extendedWaitUntil:
    visible: '.*Current bundle source: downloaded.*'
    timeout: 180000
- extendedWaitUntil:
    visible: '.*Current bundle version: manual-manifest-v1.*'
    timeout: 180000
- openLink: capgo-maestro://focus-text/Quick%20advance%20release
- tapOn:
    text: 'Quick advance release'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*(Marker: advance:success|M:advance:success).*'
    timeout: 30000
- openLink: capgo-maestro://focus-text/Quick%20download%20latest%20bundle
- tapOn:
    text: 'Quick download latest bundle'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*(Marker: download:success|M:download:success).*'
    timeout: 120000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    speed: 80
    timeout: 120000
- openLink: capgo-maestro://focus-text/Quick%20queue%20bundle
- tapOn:
    text: 'Quick queue bundle'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*(Marker: queue:success|M:queue:success).*'
    timeout: 30000
- extendedWaitUntil:
    visible: '.*Set next event: manual-manifest-v2.*'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    speed: 80
    timeout: 120000
- openLink: capgo-maestro://focus-text/Quick%20reload%20app
- tapOn:
    text: 'Quick reload app'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 180000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    speed: 80
    timeout: 120000
- extendedWaitUntil:
    visible: '.*Current bundle source: downloaded.*'
    timeout: 180000
- extendedWaitUntil:
    visible: '.*Current bundle version: manual-manifest-v2.*'
    timeout: 180000
- scrollUntilVisible:
    element:
      text: 'Quick read next bundle'
    direction: DOWN
    speed: 80
    timeout: 30000
    centerElement: false
    visibilityPercentage: 1
- openLink: capgo-maestro://focus-text/Quick%20confirm%20no%20update
- tapOn:
    text: 'Quick confirm no update'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*(Marker: no-update:success|M:no-update:success).*'
    timeout: 60000
