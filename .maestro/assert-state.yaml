appId: app.capgo.updater
---
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 90000
- scrollUntilVisible:
    element:
      text: "${EXPECT_1}"
    direction: DOWN
    speed: 80
    timeout: 180000
- assertVisible: "${EXPECT_1}"
- scrollUntilVisible:
    element:
      text: "${EXPECT_2}"
    direction: DOWN
    speed: 80
    timeout: 180000
- assertVisible: "${EXPECT_2}"
- scrollUntilVisible:
    element:
      text: "${EXPECT_3}"
    direction: DOWN
    speed: 80
    timeout: 180000
- assertVisible: "${EXPECT_3}"
- scrollUntilVisible:
    element:
      text: "${EXPECT_4}"
    direction: DOWN
    speed: 80
    timeout: 180000
- assertVisible: "${EXPECT_4}"
- scrollUntilVisible:
    element:
      text: "${EXPECT_5}"
    direction: DOWN
    speed: 80
    timeout: 180000
- assertVisible: "${EXPECT_5}"
