appId: app.capgo.updater
---
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 180000
- assertVisible: '@capgo/capacitor-updater'
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 120000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    timeout: 120000
- extendedWaitUntil:
    visible: 'Quick run smoke test sequence'
    timeout: 120000
- tapOn:
    text: 'Quick run smoke test sequence'
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*(Marker: smoke-sequence:success|M:smoke-sequence:success).*'
    timeout: 360000
- extendedWaitUntil:
    visible: 'Quick get latest'
    timeout: 120000
- tapOn:
    text: 'Quick get latest'
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*(Marker: get-latest:success|M:get-latest:success).*'
    timeout: 120000
- runFlow: helpers/cold-launch-app.yaml
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 120000
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 120000
- extendedWaitUntil:
    visible: '.*(Marker: persisted:success|M:persisted:success).*'
    timeout: 120000
