appId: app.capgo.updater
---
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 180000
- assertVisible: '@capgo/capacitor-updater'
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 120000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    speed: 80
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'qa-shortcuts-heading'
    direction: DOWN
    speed: 80
    timeout: 60000
    centerElement: true
    visibilityPercentage: 1
    waitToSettleTimeoutMs: 500
- openLink: capgo-maestro://action/set-runtime-urls
- tapOn:
    id: 'quick-action-set-runtime-urls'
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*(Marker: set-runtime-urls:success|M:set-runtime-urls:success).*'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'qa-shortcuts-heading'
    direction: DOWN
    speed: 80
    timeout: 60000
    centerElement: true
    visibilityPercentage: 1
    waitToSettleTimeoutMs: 500
- openLink: capgo-maestro://action/reset-server-release
- tapOn:
    id: 'quick-action-reset-server-release'
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*(Marker: reset:success|M:reset:success).*'
    timeout: 30000
- openLink: capgo-maestro://action/download-latest-bundle
- tapOn:
    id: 'quick-action-download-latest-bundle'
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*(Marker: download:success|M:download:success).*'
    timeout: 120000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    speed: 80
    timeout: 120000
- openLink: capgo-maestro://action/queue-last-downloaded-bundle
- tapOn:
    id: 'quick-action-queue-last-downloaded-bundle'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*(Marker: queue:success|M:queue:success).*'
    timeout: 30000
- extendedWaitUntil:
    visible: '.*Set next event: manual-manifest-v1.*'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    speed: 80
    timeout: 120000
- openLink: capgo-maestro://action/reload-app
- tapOn:
    id: 'quick-action-reload-app'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 180000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    speed: 80
    timeout: 120000
- extendedWaitUntil:
    visible: '.*Current bundle source: downloaded.*'
    timeout: 180000
- extendedWaitUntil:
    visible: '.*Current bundle version: manual-manifest-v1.*'
    timeout: 180000
- openLink: capgo-maestro://action/advance-server-release
- tapOn:
    id: 'quick-action-advance-server-release'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*(Marker: advance:success|M:advance:success).*'
    timeout: 30000
- openLink: capgo-maestro://action/download-latest-bundle
- tapOn:
    id: 'quick-action-download-latest-bundle'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*(Marker: download:success|M:download:success).*'
    timeout: 120000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    speed: 80
    timeout: 120000
- openLink: capgo-maestro://action/queue-last-downloaded-bundle
- tapOn:
    id: 'quick-action-queue-last-downloaded-bundle'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*(Marker: queue:success|M:queue:success).*'
    timeout: 30000
- extendedWaitUntil:
    visible: '.*Set next event: manual-manifest-v2.*'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    speed: 80
    timeout: 120000
- openLink: capgo-maestro://action/reload-app
- tapOn:
    id: 'quick-action-reload-app'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 180000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    speed: 80
    timeout: 120000
- extendedWaitUntil:
    visible: '.*Current bundle source: downloaded.*'
    timeout: 180000
- extendedWaitUntil:
    visible: '.*Current bundle version: manual-manifest-v2.*'
    timeout: 180000
- openLink: capgo-maestro://action/get-next-bundle
- openLink: capgo-maestro://action/get-latest-no-update
- tapOn:
    id: 'quick-action-get-latest-no-update'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*(Marker: no-update:success|M:no-update:success).*'
    timeout: 60000
