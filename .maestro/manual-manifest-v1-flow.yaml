appId: app.capgo.updater
---
- launchApp
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 180000
- assertVisible: '@capgo/capacitor-updater'
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 120000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    timeout: 120000
- extendedWaitUntil:
    visible: '.*Runtime URLs: ready.*'
    timeout: 180000
- extendedWaitUntil:
    visible: 'Quick reset release'
    timeout: 120000
- tapOn:
    text: 'Quick reset release'
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*(Marker: reset:success|M:reset:success).*'
    timeout: 120000
- extendedWaitUntil:
    visible: 'Quick download latest bundle'
    timeout: 120000
- tapOn:
    text: 'Quick download latest bundle'
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*(Marker: download:success|M:download:success).*'
    timeout: 120000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    timeout: 120000
- extendedWaitUntil:
    visible: 'Quick queue bundle'
    timeout: 120000
- tapOn:
    text: 'Quick queue bundle'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*(Marker: queue:success|M:queue:success).*'
    timeout: 30000
- extendedWaitUntil:
    visible: '.*Set next event: manual-manifest-v1.*'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    timeout: 120000
- extendedWaitUntil:
    visible: 'Quick reload app'
    timeout: 120000
- tapOn:
    text: 'Quick reload app'
    waitToSettleTimeoutMs: 500
- stopApp
- launchApp
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 180000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    timeout: 120000
- extendedWaitUntil:
    visible: '.*Current bundle source: downloaded.*'
    timeout: 180000
- extendedWaitUntil:
    visible: '.*Current bundle version: manual-manifest-v1.*'
    timeout: 180000
