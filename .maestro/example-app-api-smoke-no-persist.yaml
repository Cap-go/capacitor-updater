appId: app.capgo.updater
---
- stopApp
- launchApp:
    clearState: true
    arguments:
      isE2E: true
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 180000
- assertVisible: '@capgo/capacitor-updater'
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 120000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    speed: 80
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'quick-run-smoke-sequence'
    direction: DOWN
    speed: 80
    timeout: 60000
    centerElement: true
    visibilityPercentage: 1
    waitToSettleTimeoutMs: 500
- tapOn:
    id: 'quick-run-smoke-sequence'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*(Marker: smoke-sequence:success|M:smoke-sequence:success).*'
    timeout: 360000
- runFlow: helpers/cold-launch-app.yaml
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 120000
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 120000
- extendedWaitUntil:
    visible: '.*(Marker: persisted:success|M:persisted:success).*'
    timeout: 120000
