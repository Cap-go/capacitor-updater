appId: app.capgo.updater
---
- stopApp
- launchApp:
    arguments:
      isE2E: true
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 180000
- assertVisible: '@capgo/capacitor-updater'
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 90000
- scrollUntilVisible:
    element: 'Quick run smoke test sequence'
    direction: UP
    timeout: 30000
    speed: 80
- tapOn:
    text: 'Quick run smoke test sequence'
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: '.*Smoke sequence: success.*'
    timeout: 180000
