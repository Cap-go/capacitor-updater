appId: app.capgo.updater
---
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 180000
- assertVisible: '@capgo/capacitor-updater'
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 120000
- extendedWaitUntil:
    visible: 'Quick reset release'
    timeout: 120000
- tapOn:
    text: 'Quick reset release'
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*(Marker: reset:success|M:reset:success).*'
    timeout: 120000
- extendedWaitUntil:
    visible: 'Quick download latest bundle'
    timeout: 120000
- tapOn:
    text: 'Quick download latest bundle'
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '.*(Marker: download:success|M:download:success).*'
    timeout: 120000
- extendedWaitUntil:
    visible: 'Quick mark bundle error'
    timeout: 120000
- tapOn:
    text: 'Quick mark bundle error'
    waitToSettleTimeoutMs: 500
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: '.*(Marker: bundle:(success|expected-rejection)|M:bundle:(success|expected-rejection)).*'
    timeout: 60000
