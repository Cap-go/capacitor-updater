appId: app.capgo.updater
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: '@capgo/capacitor-updater'
    timeout: 180000
- assertVisible: '@capgo/capacitor-updater'
- extendedWaitUntil:
    visible: '.*Harness: ready.*'
    timeout: 120000
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    timeout: 120000
- scrollUntilVisible:
    element:
      text: 'QA shortcuts'
    direction: DOWN
    timeout: 120000
    centerElement: true
    visibilityPercentage: 1
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: 'quick-run-smoke-sequence'
    direction: DOWN
    timeout: 120000
    centerElement: true
    visibilityPercentage: 1
    waitToSettleTimeoutMs: 500
- tapOn:
    id: 'quick-run-smoke-sequence'
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      text: '@capgo/capacitor-updater'
    direction: UP
    timeout: 120000
- extendedWaitUntil:
    visible: '.*(Marker: smoke-sequence:success|M:smoke-sequence:success).*'
    timeout: 240000
