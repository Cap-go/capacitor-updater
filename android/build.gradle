ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "ee.forgr.capacitor_updater"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        consumerProguardFiles "consumer-rules.pro"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}


dependencies {
    def work_version = "2.10.5"
    def lifecycle_version = "2.10.0"
    implementation "androidx.work:work-runtime:$work_version"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"
    implementation "com.google.android.gms:play-services-tasks:18.4.1"
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    // BridgeActivity extends AppCompatActivity: the plugin needs AppCompat on its compile classpath.
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // Play Core library for in-app updates
    implementation 'com.google.android.play:app-update:2.1.0'
    testImplementation "junit:junit:$junitVersion"
    testImplementation "androidx.work:work-testing:$work_version"
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.json:json:20250517'
    testImplementation 'org.robolectric:robolectric:4.17'
}

// JVM unit tests load the shared Rust core (../core) built for the host machine.
// The npm package does not ship core/, so app builds never run cargo; they use
// the prebuilt src/main/jniLibs from scripts/build-core.sh android.
def capgoCoreDir = file("../core")
if (capgoCoreDir.exists()) {
    def capgoCoreHostLibDir = new File(capgoCoreDir, "target/host/release")
    def buildCapgoCoreHost = tasks.register("buildCapgoCoreHost", Exec) {
        description = "Builds the Capgo Rust core for the host JVM (unit tests)"
        workingDir capgoCoreDir
        def cargoHome = System.getenv("CARGO_HOME") ?: "${System.getProperty('user.home')}/.cargo"
        def rustupCargo = new File(cargoHome, "bin/cargo")
        executable rustupCargo.exists() ? rustupCargo.absolutePath : "cargo"
        args "build", "--release", "--locked", "--features", "jni", "--target-dir", "target/host"
        inputs.dir(new File(capgoCoreDir, "src"))
        inputs.file(new File(capgoCoreDir, "Cargo.toml"))
        inputs.file(new File(capgoCoreDir, "Cargo.lock"))
        outputs.dir(capgoCoreHostLibDir)
    }
    tasks.withType(Test).configureEach {
        dependsOn buildCapgoCoreHost
        systemProperty "capgo.core.hostLibrary", new File(capgoCoreHostLibDir, System.mapLibraryName("capgo_updater_core")).absolutePath
    }
}

tasks.withType(Test) {
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        exceptionFormat "full"
        showStandardStreams = true
        showCauses = true
        showStackTraces = true
    }
}
