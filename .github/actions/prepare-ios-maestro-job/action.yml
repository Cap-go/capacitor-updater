name: Prepare iOS Maestro job
description: Overlap simulator boot, artifact downloads, Node, Bun, and Maestro setup.
inputs:
  web-artifact-name:
    description: Workflow artifact name for reusable web assets.
    required: true
  ios-artifact-name:
    description: Workflow artifact name for the prebuilt iOS app bundle.
    required: true
  ios-artifact-dir:
    description: Directory where the iOS app artifact should be extracted.
    required: true
  bun-version:
    description: Bun version to install.
    default: 1.4.2
  maestro-version:
    description: Maestro CLI release tag.
    default: cli-2.4.0
  node-version:
    description: Node.js version for Capacitor CLI.
    default: 26.11.0
runs:
  using: composite
  steps:
    - name: Boot iOS simulator early
      shell: bash
      run: |
        set -euo pipefail
        simulator_id="$(./scripts/maestro/select-ios-simulator.sh)"
        echo "CAPGO_MAESTRO_IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
        xcrun simctl boot "$simulator_id" >/dev/null 2>&1 || true
    - name: Cache Maestro job runtimes
      uses: actions/cache@v6
      with:
        path: |
          ~/.bun
          ~/.maestro
          ~/.capgo-node
        key: ${{ runner.os }}-maestro-runtimes-${{ inputs.bun-version }}-${{ inputs.maestro-version }}-${{ inputs.node-version }}
        restore-keys: |
          ${{ runner.os }}-maestro-runtimes-${{ inputs.bun-version }}-${{ inputs.maestro-version }}-
          ${{ runner.os }}-maestro-runtimes-${{ inputs.bun-version }}-
          ${{ runner.os }}-maestro-runtimes-
    - name: Download artifacts and install runtimes
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BUN_VERSION: ${{ inputs.bun-version }}
        MAESTRO_VERSION: ${{ inputs.maestro-version }}
        NODE_VERSION: ${{ inputs.node-version }}
        CAPGO_MAESTRO_WEB_ARTIFACT: ${{ inputs.web-artifact-name }}
        CAPGO_MAESTRO_IOS_ARTIFACT: ${{ inputs.ios-artifact-name }}
        CAPGO_MAESTRO_IOS_ARTIFACT_DIR: ${{ inputs.ios-artifact-dir }}
      run: bash ./.github/scripts/prepare-ios-maestro-ci.sh
