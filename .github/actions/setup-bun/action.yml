name: Setup Bun
description: Install cached Bun and optionally install Bun dependencies.
inputs:
  bun-version:
    description: Bun version to install.
    default: 1.3.12
  dependency-cache-key:
    description: Cache key for dependency directories.
    default: ''
  dependency-cache-path:
    description: Newline-separated dependency directories to cache.
    default: ''
  install-dependencies:
    description: Run bun install in the repository root.
    default: 'true'
  install-example:
    description: Run bun install in example-app.
    default: 'false'
runs:
  using: composite
  steps:
    # macOS runners ship Node: skip the download (over a minute while the simulator boots)
    # when the preinstalled one is recent enough for the Capacitor CLI (22+).
    - name: Check preinstalled Node.js
      id: node
      shell: bash
      run: |
        if command -v node >/dev/null 2>&1 && node -e "process.exit(Number(process.versions.node.split('.')[0]) >= 22 ? 0 : 1)"; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Setup Node.js
      if: steps.node.outputs.ok != 'true' || runner.os != 'macOS'
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    # On macOS, restoring the cached binary can take minutes while the simulator boots; the
    # installer downloads the release zip directly in seconds.
    - name: Cache Bun runtime
      if: runner.os != 'macOS'
      uses: actions/cache@v6
      with:
        path: ~/.bun
        key: ${{ runner.os }}-bun-${{ inputs.bun-version }}
    - name: Install Bun
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/ci/install-bun.sh
    - name: Cache Bun dependencies
      if: inputs.dependency-cache-key != '' && inputs.dependency-cache-path != ''
      uses: actions/cache@v6
      with:
        path: ${{ inputs.dependency-cache-path }}
        key: ${{ inputs.dependency-cache-key }}
        restore-keys: |
          ${{ runner.os }}-bun-deps-
    - name: Install root dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: bun install
    - name: Install example app dependencies
      if: inputs.install-example == 'true'
      shell: bash
      working-directory: example-app
      run: bun install
