          path: maestro-ios-apps
      - name: Run live update Maestro flows
        run: |
          set -euo pipefail
          CAPGO_MAESTRO_SKIP_BUILD=1 \
          CAPGO_MAESTRO_SKIP_BUNDLE_BUILD=1 \
          CAPGO_MAESTRO_IOS_ASSUME_CLEAN_INSTALL=1 \
          CAPGO_MAESTRO_IOS_APP_PATH=maestro-ios-apps/${{ matrix.scenario }}/App.app \
          CAPGO_MAESTRO_RESULTS_DIR=maestro-results-ios-live-update/${{ matrix.scenario }} \
          CAPGO_MAESTRO_TIMEOUT_SECONDS=300 \
          CAPGO_MAESTRO_TEST_RETRIES=2 \
          MAESTRO_DRIVER_STARTUP_TIMEOUT=180000 \
          ./scripts/maestro/run-ios-live-update.sh "${{ matrix.scenario }}"
      - name: Upload live update Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-ios-live-update-${{ matrix.scenario }}
          path: maestro-results-ios-live-update/${{ matrix.scenario }}

  # Built separately from maestro_ios_apps so both builds stay under the 10 minute job cap.
  maestro_ios_edge_apps:
    permissions:
      contents: read
      actions: write
    needs: maestro_web_assets
    timeout-minutes: 10
    runs-on: macOS-latest
    name: Build iOS Maestro edge case apps
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Download reusable Maestro web assets
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Build iOS apps
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/maestro-ios-edge-apps"
          derived_data_path="$RUNNER_TEMP/maestro-ios-derived"
          scenarios=(
            edge-deferred
            edge-direct
          )

          rm -rf "$artifact_root" "$derived_data_path"
          mkdir -p "$artifact_root"

          for scenario in "${scenarios[@]}"; do
            app_artifact_path="$artifact_root/$scenario"
            bun scripts/maestro/prepare-ios-scenario.mjs "$scenario"
            xcodebuild \
              -project example-app/ios/App/App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath "$derived_data_path" \
              build
            mkdir -p "$app_artifact_path"
            ditto "$derived_data_path/Build/Products/Debug-iphonesimulator/App.app" "$app_artifact_path/App.app"
          done
      - name: Upload iOS apps
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-edge-apps
          path: ${{ runner.temp }}/maestro-ios-edge-apps
          if-no-files-found: error

  maestro_ios_edge_cases:
    permissions:
      contents: read
      actions: write
    needs:
      - maestro_web_assets
      - maestro_ios_edge_apps
    timeout-minutes: 10
    runs-on: macOS-latest
    name: iOS example app Maestro edge case / ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: edge-network-drop
            app: edge-deferred
            edge_case_retries: 2
          - scenario: edge-kill-download
            app: edge-deferred
            edge_case_retries: 1
          - scenario: edge-corrupt-bundle
            app: edge-deferred
            edge_case_retries: 1
          - scenario: edge-offline-check
            app: edge-deferred
            edge_case_retries: 1
          - scenario: edge-direct-network-drop
            app: edge-direct
            edge_case_retries: 1
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Boot in the background so it overlaps the setup steps; the runner waits on bootstatus.
      # A full edge case needs most of the 10 minute cap, so a blocking boot can push it over.
      - name: Boot iOS simulator early
        run: |
          set -euo pipefail
          simulator_id="$(./scripts/maestro/select-ios-simulator.sh)"
          echo "CAPGO_MAESTRO_IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$simulator_id" >/dev/null 2>&1 &
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-dependencies: 'false'
          setup-node: 'false'
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Download reusable Maestro web assets
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Download iOS app
        uses: actions/download-artifact@v8
        with:
          name: maestro-ios-edge-apps
          path: maestro-ios-edge-apps
      # A full case takes most of the 10 minute cap on hosted macOS runners. edge-network-drop
      # alone gets one retry for simulator crashes during recovery; other cases stay at one attempt.
      # The single recovery flow includes the XCTest driver startup (up to ~2 minutes), hence 360s.
      - name: Run edge case Maestro flows
        run: |
          set -euo pipefail
          CAPGO_MAESTRO_SKIP_BUILD=1 \
          CAPGO_MAESTRO_SKIP_BUNDLE_BUILD=1 \
          CAPGO_MAESTRO_IOS_ASSUME_CLEAN_INSTALL=1 \
          CAPGO_MAESTRO_IOS_APP_PATH=maestro-ios-edge-apps/${{ matrix.app }}/App.app \
          CAPGO_MAESTRO_RESULTS_DIR=maestro-results-ios-live-update/${{ matrix.scenario }} \
          CAPGO_MAESTRO_TIMEOUT_SECONDS=360 \
          CAPGO_MAESTRO_EDGE_CASE_RETRIES=${{ matrix.edge_case_retries }} \
          MAESTRO_DRIVER_STARTUP_TIMEOUT=180000 \
          ./scripts/maestro/run-ios-live-update.sh "${{ matrix.scenario }}"
      - name: Upload edge case Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-ios-edge-${{ matrix.scenario }}
          path: maestro-results-ios-live-update/${{ matrix.scenario }}

  web:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Build code and test
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Self-test LTS constraint restore
        run: bun .github/scripts/restore-lts-constraints.mjs --self-test
      - name: Lint
        id: lint_code
        run: bun run eslint && bun run prettier -- --check
      - name: Build
        id: build_code
        run: bun run build
      - name: Verify packed package in example app (Web)
        shell: bash
        run: CAPGO_VERIFY_PACKED_SKIP_BUILD=1 bash ./.github/scripts/verify-packed-example.sh web

  maestro_android_scenarios:
    permissions:
      contents: read
      actions: read
    needs:
      - maestro_web_assets
      - maestro_android_apps
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: maestro_android / ${{ matrix.scenario }}
    env:
      CAPGO_MAESTRO_SUCCESS_MARKER: ${{ github.workspace }}/maestro-android-live-update.pass
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - deferred
          - always
          - at-install
          - on-launch
          - manual-zip-config-guards
          - manual-manifest
        # Edge cases share one app build per app scenario and inject failures via the fake server.
        include:
          - scenario: edge-network-drop
            app: edge-deferred
          - scenario: edge-kill-download
            app: edge-deferred
          - scenario: edge-corrupt-bundle
            app: edge-deferred
          - scenario: edge-offline-check
            app: edge-deferred
          - scenario: edge-direct-network-drop
            app: edge-direct
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-dependencies: 'false'
          setup-node: 'false'
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Download reusable Maestro web assets (attempt 1)
        id: download_maestro_web_assets_1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before retrying Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 2)
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        id: download_maestro_web_assets_2
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before final Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 3)
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Download Android app (attempt 1)
        id: download_android_app_1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-android-app-${{ matrix.app || matrix.scenario }}
          path: example-app/android/app/build/outputs/apk/debug
      - name: Wait before retrying Android app download
        if: steps.download_android_app_1.outcome == 'failure'
        run: sleep 15
      - name: Download Android app (attempt 2)
        if: steps.download_android_app_1.outcome == 'failure'
        id: download_android_app_2
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-android-app-${{ matrix.app || matrix.scenario }}
          path: example-app/android/app/build/outputs/apk/debug
      - name: Wait before final Android app download
        if: steps.download_android_app_1.outcome == 'failure' && steps.download_android_app_2.outcome == 'failure'
        run: sleep 15
      - name: Download Android app (attempt 3)
        if: steps.download_android_app_1.outcome == 'failure' && steps.download_android_app_2.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: maestro-android-app-${{ matrix.app || matrix.scenario }}
          path: example-app/android/app/build/outputs/apk/debug
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Clear Android SDK temp cache
        shell: bash
        run: bash ./.github/scripts/ensure-android-emulator-sdk.sh
      # The runner action tears the emulator down inside this step, and that teardown can hang
      # for minutes after the flow already passed (an orphaned crashpad_handler keeps the pipe
      # open). Bound the step below the job cap and let the success marker decide the result,
      # so a hung teardown cannot burn the whole 10 minutes or fail a passing scenario.
      - name: Run live update Maestro flow
        id: maestro_live_flow_1
        timeout-minutes: ${{ matrix.scenario == 'edge-corrupt-bundle' && 9 || 8 }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: >-
            CAPGO_MAESTRO_SKIP_BUILD=1
            CAPGO_MAESTRO_SKIP_BUNDLE_BUILD=1
            MAESTRO_FLOW_TIMEOUT_SECONDS=300
            CAPGO_MAESTRO_FLOW_RETRIES=2
            CAPGO_MAESTRO_SPLIT_RETRIES=2
            CAPGO_MAESTRO_UI_STATE_TIMEOUT_SECONDS=180
            CAPGO_MAESTRO_DIRECT_UPDATE_SETTLE_TIMEOUT_SECONDS=180
            bash ./scripts/maestro/run-android-live-update-ci.sh "${{ matrix.scenario }}"
      - name: Detect live update success marker after first attempt
        id: maestro_live_marker_1
        if: always() && steps.maestro_live_flow_1.outcome != 'skipped'
        run: |
          if [[ -f "$CAPGO_MAESTRO_SUCCESS_MARKER" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Clear Android SDK temp cache (retry)
        if: steps.maestro_live_flow_1.outcome == 'failure' && steps.maestro_live_marker_1.outputs.present != 'true'
        shell: bash
        run: bash ./.github/scripts/ensure-android-emulator-sdk.sh
      - name: Run live update Maestro flow (retry after emulator SDK flake)
        if: steps.maestro_live_flow_1.outcome == 'failure' && steps.maestro_live_marker_1.outputs.present != 'true'
        timeout-minutes: ${{ matrix.scenario == 'edge-corrupt-bundle' && 9 || 8 }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: >-
            CAPGO_MAESTRO_SKIP_BUILD=1
            CAPGO_MAESTRO_SKIP_BUNDLE_BUILD=1
            MAESTRO_FLOW_TIMEOUT_SECONDS=300
            CAPGO_MAESTRO_FLOW_RETRIES=2
            CAPGO_MAESTRO_SPLIT_RETRIES=2
            CAPGO_MAESTRO_UI_STATE_TIMEOUT_SECONDS=180
            CAPGO_MAESTRO_DIRECT_UPDATE_SETTLE_TIMEOUT_SECONDS=180
            bash ./scripts/maestro/run-android-live-update-ci.sh "${{ matrix.scenario }}"
      - name: Verify live update scenario passed
        run: |
          if [[ ! -f "$CAPGO_MAESTRO_SUCCESS_MARKER" ]]; then
            echo "Android live update Maestro scenario '${{ matrix.scenario }}' did not pass."
            exit 1
          fi
          echo "Android live update Maestro scenario '${{ matrix.scenario }}' passed."
      - name: Upload fake Capgo server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-server-log-${{ matrix.scenario }}
          path: .maestro-artifacts/fake-capgo-server.log
          if-no-files-found: ignore

  maestro_android:
    if: always()
    needs:
      - maestro_android_scenarios
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any live update scenario fails
        run: |
          if [[ "${{ needs.maestro_android_scenarios.result }}" != "success" ]]; then
            echo "One or more Android live update Maestro scenarios failed."
            exit 1
          fi
