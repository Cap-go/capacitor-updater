      - maestro_ios_apps
    timeout-minutes: 10
    runs-on: macOS-latest
    name: iOS example app Maestro live update / ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - always
          - on-launch
    steps:
      - name: Check out
