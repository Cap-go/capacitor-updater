  maestro_android_example_app:
    permissions:
      contents: read
      actions: write
    needs:
      - maestro_web_assets
      - maestro_android_apps
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Android example app Maestro smoke / ${{ matrix.scenario }}
    env:
      CAPGO_MAESTRO_SUCCESS_MARKER: ${{ github.workspace }}/maestro-android-smoke.pass
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - manual-zip
          - manual-zip-no-persist
          - manual-zip-config-guards
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Download reusable Maestro web assets
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Download Android app
        uses: actions/download-artifact@v8
        with:
          name: maestro-android-app-${{ matrix.scenario }}
          path: example-app/android/app/build/outputs/apk/debug
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Clear Android SDK temp cache
        shell: bash
        run: bash ./.github/scripts/ensure-android-emulator-sdk.sh
      # Same emulator teardown hazard as the live update job: bound the step below the job cap
      # and let the success marker decide the result.
      - name: Run Maestro smoke tests
        id: maestro_smoke_flow_1
        timeout-minutes: 10
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: >-
            CAPGO_MAESTRO_SKIP_BUILD=1
            CAPGO_MAESTRO_SKIP_BUNDLE_BUILD=1
            CAPGO_MAESTRO_TIMEOUT_SECONDS=600
            CAPGO_MAESTRO_TEST_RETRIES=2
            CAPGO_MAESTRO_APP_UI_TIMEOUT_SECONDS=150
            CAPGO_MAESTRO_APP_LAUNCH_RETRIES=2
            MAESTRO_DRIVER_STARTUP_TIMEOUT=300000
            CAPGO_MAESTRO_SMOKE_SCENARIO=${{ matrix.scenario }}
            bun run test:maestro:android && : > "$CAPGO_MAESTRO_SUCCESS_MARKER"
      - name: Clear Android SDK temp cache (retry)
        if: steps.maestro_smoke_flow_1.outcome == 'failure'
        shell: bash
        run: bash ./.github/scripts/ensure-android-emulator-sdk.sh
      - name: Run Maestro smoke tests (retry after emulator SDK flake)
        if: steps.maestro_smoke_flow_1.outcome == 'failure'
        timeout-minutes: 10
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: >-
            CAPGO_MAESTRO_SKIP_BUILD=1
            CAPGO_MAESTRO_SKIP_BUNDLE_BUILD=1
            CAPGO_MAESTRO_TIMEOUT_SECONDS=600
            CAPGO_MAESTRO_TEST_RETRIES=2
            CAPGO_MAESTRO_APP_UI_TIMEOUT_SECONDS=150
            CAPGO_MAESTRO_APP_LAUNCH_RETRIES=2
            MAESTRO_DRIVER_STARTUP_TIMEOUT=300000
            CAPGO_MAESTRO_SMOKE_SCENARIO=${{ matrix.scenario }}
            bun run test:maestro:android && : > "$CAPGO_MAESTRO_SUCCESS_MARKER"
      - name: Verify smoke scenario passed
        run: |
          if [[ ! -f "$CAPGO_MAESTRO_SUCCESS_MARKER" ]]; then
            echo "Android smoke Maestro scenario '${{ matrix.scenario }}' did not pass."
            exit 1
          fi
          echo "Android smoke Maestro scenario '${{ matrix.scenario }}' passed."
      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-android-${{ matrix.scenario }}
          path: maestro-results

  maestro_ios_example_app:
