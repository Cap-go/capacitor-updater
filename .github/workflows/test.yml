name: Build source code and test it

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - renovate/**
  pull_request:
    branches: [main, v5, v6, v7]
  workflow_dispatch:
  workflow_call: # Allow this workflow to be called by other workflows

env:
  BUN_VERSION: 1.3.12
  MAESTRO_VERSION: cli-2.4.0
  CAPGO_MAESTRO_DEVICE_BASE_URL: http://127.0.0.1:3192

permissions: {}

jobs:
  guard_swiftpm_version:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enforce capacitor-swift-pm version
        run: |
          set -euo pipefail
          MAJOR=$(awk -F'"' '/"version":/{print $4; exit}' package.json | cut -d. -f1)
          if ! grep -Eq "https://github.com/ionic-team/capacitor-swift-pm\\.git\"[[:space:]]*,[[:space:]]*from:[[:space:]]*\"${MAJOR}\\.0\\.0\"" Package.swift; then
            echo "Expected capacitor-swift-pm to be pinned to ${MAJOR}.0.0 in Package.swift"
            exit 1
          fi

  rust_core:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Rust core (fmt, clippy, contract tests)
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - name: Format
        working-directory: core
        run: cargo fmt --check
      - name: Clippy
        working-directory: core
        run: cargo clippy --locked --all-targets --features jni -- -D warnings
      - name: Test (shared native contract fixtures)
        working-directory: core
        run: cargo test --locked
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Decrypt bundles freshly encrypted by the pinned Capgo CLI
        # The committed fixtures ran above; this re-encrypts with the CLI so every CLI bump is re-checked.
        run: bun run generate:cli-crypto && cd core && cargo test --locked --test cli_crypto

  c_core:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: C core (Rust core tests through the C ABI)
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
          key: c-core
      - name: Cache C core dependencies
        uses: actions/cache@v4
        with:
          path: core-c/.deps
          key: core-c-deps-${{ hashFiles('core-c/CMakeLists.txt') }}
      - name: Build C core
        run: |
          cmake -S core-c -B core-c/build -DCAPGO_TEST_SUPPORT=ON
          cmake --build core-c/build -j "$(nproc)"
      - name: Test C core (the Rust core's suite, through the C ABI)
        working-directory: core
        run: CAPGO_CORE_LIB="$GITHUB_WORKSPACE/core-c/build/libcapgo_updater_core.so" cargo test --locked

  c_core_memcheck:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: C core (Valgrind memcheck, UndefinedBehaviorSanitizer)
    # ASan is not used here: its runtime preloaded into the uninstrumented Rust test process
    # corrupts its own thread registry on Linux (seen with GCC and Clang, never on macOS),
    # while Valgrind, which also sees writes from system libraries (zlib), reports nothing.
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain and Valgrind
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
          key: c-core-memcheck
      - name: Cache C core dependencies
        uses: actions/cache@v4
        with:
          path: core-c/.deps
          key: core-c-deps-${{ hashFiles('core-c/CMakeLists.txt') }}
      - name: Build test binaries
        working-directory: core
        run: cargo test --locked --tests --no-run
      - name: Test C core with UndefinedBehaviorSanitizer (trap on undefined behavior)
        run: |
          CC=clang cmake -S core-c -B core-c/build-ubsan -DCAPGO_TEST_SUPPORT=ON -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_C_FLAGS=-fsanitize=undefined -fsanitize-trap=undefined"
          cmake --build core-c/build-ubsan -j "$(nproc)"
          cd core
          CAPGO_CORE_LIB="$GITHUB_WORKSPACE/core-c/build-ubsan/libcapgo_updater_core.so" cargo test --locked --tests
      - name: Test C core under Valgrind memcheck
        run: |
          cmake -S core-c -B core-c/build-debug -DCAPGO_TEST_SUPPORT=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build core-c/build-debug -j "$(nproc)"
          cd core
          CAPGO_CORE_LIB="$GITHUB_WORKSPACE/core-c/build-debug/libcapgo_updater_core.so" timeout 360 cargo test --locked --tests \
            --config 'target."cfg(all())".runner="valgrind -q --error-exitcode=9 --fair-sched=yes --max-threads=5000 --suppressions=../core-c/valgrind.supp"'

  c_core_android:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: C core (Android JVM tests, all ABIs build)
    env:
      CAPGO_CORE_IMPL: c
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Cache C core dependencies
        uses: actions/cache@v4
        with:
          path: core-c/.deps
          key: core-c-deps-${{ hashFiles('core-c/CMakeLists.txt') }}
      - name: Build C core (Android, every ABI)
        run: ./scripts/build-core.sh android
      - name: Android JVM tests against the C core
        run: bun run test:android

  c_core_ios:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: macOS-latest
    name: C core (iOS native tests)
    env:
      CAPGO_CORE_IMPL: c
      CAPGO_CORE_IOS_SIMULATOR_ONLY: '1'
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Cache C core dependencies
        uses: actions/cache@v4
        with:
          path: core-c/.deps
          key: core-c-deps-${{ hashFiles('core-c/CMakeLists.txt') }}
      - name: Run iOS native tests against the C core
        run: bun run native:test:ios

  build_android:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Build Rust core (Android)
        uses: ./.github/actions/build-core
        with:
          platform: android
      - name: Build and test Android plugin
        id: build_code
        run: bun run verify:android
      - name: Verify packed package in example app (Android)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh android

  build_ios:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: macOS-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Build Rust core (iOS)
        uses: ./.github/actions/build-core
        with:
          platform: ios
      - name: Build
        id: build_code
        run: bun run verify:ios
      - name: Verify packed package in example app (iOS)
        shell: bash
        run: bash ./.github/scripts/verify-packed-example.sh ios

  # Split from build_ios: the core build, device build, packed-package check and the
  # simulator test build together came within seconds of the 10 minute cap.
  test_ios:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: macOS-latest
    env:
      # Simulator tests only need the arm64 simulator slice of the core (saves two release builds).
      CAPGO_CORE_IOS_SIMULATOR_ONLY: '1'
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Build Rust core (iOS)
        uses: ./.github/actions/build-core
        with:
          platform: ios
      - name: Run iOS native tests
        id: test_ios
        run: bun run native:test:ios

  maestro_web_assets:
    permissions:
      contents: read
      actions: write
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Build Maestro web assets
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Build reusable Maestro web assets
        run: bun scripts/maestro/build-bundles.mjs all
      - name: Upload reusable Maestro web assets (attempt 1)
        id: upload_maestro_web_assets_1
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-web-assets
          path: |
            dist
            .maestro-artifacts
          include-hidden-files: true
          if-no-files-found: error
      - name: Wait before retrying Maestro web assets upload
        if: steps.upload_maestro_web_assets_1.outcome == 'failure'
        run: sleep 15
      - name: Upload reusable Maestro web assets (attempt 2)
        if: steps.upload_maestro_web_assets_1.outcome == 'failure'
        id: upload_maestro_web_assets_2
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-web-assets
          overwrite: true
          path: |
            dist
            .maestro-artifacts
          include-hidden-files: true
          if-no-files-found: error
      - name: Wait before final Maestro web assets upload
        if: steps.upload_maestro_web_assets_1.outcome == 'failure' && steps.upload_maestro_web_assets_2.outcome == 'failure'
        run: sleep 15
      - name: Upload reusable Maestro web assets (attempt 3)
        if: steps.upload_maestro_web_assets_1.outcome == 'failure' && steps.upload_maestro_web_assets_2.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: maestro-web-assets
          overwrite: true
          path: |
            dist
            .maestro-artifacts
          include-hidden-files: true
          if-no-files-found: error

  maestro_android_apps:
    permissions:
      contents: read
      actions: write
    needs: maestro_web_assets
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Build Android Maestro app / ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - deferred
          - always
          - legacy-true
          - at-install
          - on-launch
          - manual-zip
          - manual-zip-no-persist
          - manual-zip-config-guards
          - manual-manifest
          - edge-deferred
          - edge-direct
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Download reusable Maestro web assets (attempt 1)
        id: download_maestro_web_assets_1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before retrying Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 2)
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        id: download_maestro_web_assets_2
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before final Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 3)
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Build Rust core (Android)
        uses: ./.github/actions/build-core
        with:
          platform: android
      - name: Build Android app
        run: bun scripts/maestro/prepare-android-scenario.mjs "${{ matrix.scenario }}"
      - name: Upload Android app (attempt 1)
        id: upload_android_app_1
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-app-${{ matrix.scenario }}
          path: example-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Wait before retrying Android app upload
        if: steps.upload_android_app_1.outcome == 'failure'
        run: sleep 15
      - name: Upload Android app (attempt 2)
        if: steps.upload_android_app_1.outcome == 'failure'
        id: upload_android_app_2
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-app-${{ matrix.scenario }}
          overwrite: true
          path: example-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Wait before final Android app upload
        if: steps.upload_android_app_1.outcome == 'failure' && steps.upload_android_app_2.outcome == 'failure'
        run: sleep 15
      - name: Upload Android app (attempt 3)
        if: steps.upload_android_app_1.outcome == 'failure' && steps.upload_android_app_2.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-app-${{ matrix.scenario }}
          overwrite: true
          path: example-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  maestro_ios_apps:
    permissions:
      contents: read
      actions: write
    needs: maestro_web_assets
    timeout-minutes: 10
    runs-on: macOS-latest
    name: Build iOS Maestro apps
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Download reusable Maestro web assets (attempt 1)
        id: download_maestro_web_assets_1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before retrying Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 2)
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        id: download_maestro_web_assets_2
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before final Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 3)
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Build Rust core (iOS)
        uses: ./.github/actions/build-core
        with:
          platform: ios
      - name: Build iOS app
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/maestro-ios-apps"
          derived_data_path="$RUNNER_TEMP/maestro-ios-derived"
          scenarios=(
            deferred
            always
            legacy-true
            at-install
            on-launch
            manual-zip
            manual-zip-no-persist
            manual-zip-config-guards
            manual-manifest
          )

          rm -rf "$artifact_root" "$derived_data_path"
          mkdir -p "$artifact_root"

          for scenario in "${scenarios[@]}"; do
            app_artifact_path="$artifact_root/$scenario"
            bun scripts/maestro/prepare-ios-scenario.mjs "$scenario"
            xcodebuild \
              -project example-app/ios/App/App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath "$derived_data_path" \
              build
            mkdir -p "$app_artifact_path"
            ditto "$derived_data_path/Build/Products/Debug-iphonesimulator/App.app" "$app_artifact_path/App.app"
          done
      - name: Upload iOS apps
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-apps
          path: ${{ runner.temp }}/maestro-ios-apps
          if-no-files-found: error

  maestro_android_example_app:
    permissions:
      contents: read
      actions: write
    needs:
      - maestro_web_assets
      - maestro_android_apps
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Android example app Maestro smoke / ${{ matrix.scenario }}
    env:
      CAPGO_MAESTRO_SUCCESS_MARKER: ${{ github.workspace }}/maestro-android-smoke.pass
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - manual-zip
          - manual-zip-no-persist
          - manual-zip-config-guards
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Download reusable Maestro web assets
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Download Android app
        uses: actions/download-artifact@v8
        with:
          name: maestro-android-app-${{ matrix.scenario }}
          path: example-app/android/app/build/outputs/apk/debug
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Same emulator teardown hazard as the live update job: bound the step below the job cap
      # and let the success marker decide the result.
      - name: Run Maestro smoke tests
        timeout-minutes: 8
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: >-
            CAPGO_MAESTRO_SKIP_BUILD=1
            CAPGO_MAESTRO_SKIP_BUNDLE_BUILD=1
            CAPGO_MAESTRO_TIMEOUT_SECONDS=600
            CAPGO_MAESTRO_TEST_RETRIES=2
            CAPGO_MAESTRO_APP_UI_TIMEOUT_SECONDS=150
            CAPGO_MAESTRO_APP_LAUNCH_RETRIES=2
            MAESTRO_DRIVER_STARTUP_TIMEOUT=300000
            CAPGO_MAESTRO_SMOKE_SCENARIO=${{ matrix.scenario }}
            bun run test:maestro:android && : > "$CAPGO_MAESTRO_SUCCESS_MARKER"
      - name: Verify smoke scenario passed
        run: |
          if [[ ! -f "$CAPGO_MAESTRO_SUCCESS_MARKER" ]]; then
            echo "Android smoke Maestro scenario '${{ matrix.scenario }}' did not pass."
            exit 1
          fi
          echo "Android smoke Maestro scenario '${{ matrix.scenario }}' passed."
      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-android-${{ matrix.scenario }}
          path: maestro-results

  maestro_ios_example_app:
    permissions:
      contents: read
      actions: write
    needs:
      - maestro_web_assets
      - maestro_ios_apps
    timeout-minutes: 10
    runs-on: macOS-latest
    name: iOS example app Maestro smoke / ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - manual-zip
          - manual-zip-no-persist
          - manual-zip-config-guards
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-dependencies: 'false'
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Download reusable Maestro web assets
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Download iOS app
        uses: actions/download-artifact@v8
        with:
          name: maestro-ios-apps
          path: maestro-ios-apps
      # Boot after the setup steps: a booting simulator starves them of CPU (Bun and Maestro
      # setup took 2-4 minutes during the boot and ~20 s without it).
      - name: Boot iOS simulator
        run: |
          set -euo pipefail
          simulator_id="$(./scripts/maestro/select-ios-simulator.sh)"
          echo "CAPGO_MAESTRO_IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id" >/dev/null 2>&1 || true
      - name: Run Maestro smoke tests
        run: >-
          CAPGO_MAESTRO_SKIP_BUILD=1
          CAPGO_MAESTRO_SKIP_BUNDLE_BUILD=1
          CAPGO_MAESTRO_IOS_ASSUME_CLEAN_INSTALL=1
          CAPGO_MAESTRO_IOS_APP_PATH=maestro-ios-apps/${{ matrix.scenario }}/App.app
          CAPGO_MAESTRO_SMOKE_SCENARIO=${{ matrix.scenario }}
          CAPGO_MAESTRO_TEST_RETRIES=2
          CAPGO_MAESTRO_IOS_REINSTALL_ON_RETRY=1
          CAPGO_MAESTRO_TIMEOUT_SECONDS=300
          MAESTRO_DRIVER_STARTUP_TIMEOUT=90000
          bun run test:maestro:ios:smoke
      - name: Collect iOS crash reports
        if: failure()
        timeout-minutes: 1
        run: |
          mkdir -p "maestro-results-ios/crash-reports"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 2 -type f \( -name 'App*.ips' -o -name 'App*.crash' \) -exec cp {} "maestro-results-ios/crash-reports/" \; 2>/dev/null || true
      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-ios-${{ matrix.scenario }}
          path: maestro-results-ios

  maestro_ios_live_update:
    permissions:
      contents: read
      actions: write
    needs:
      - maestro_web_assets
      - maestro_ios_apps
    timeout-minutes: 10
    runs-on: macOS-latest
    name: iOS example app Maestro live update / ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - always
          - legacy-true
          - on-launch
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-dependencies: 'false'
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Download reusable Maestro web assets
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Download iOS app
        uses: actions/download-artifact@v8
        with:
          name: maestro-ios-apps
          path: maestro-ios-apps
      # Boot after the setup steps: a booting simulator starves them of CPU (Bun and Maestro
      # setup took 2-4 minutes during the boot and ~20 s without it).
      - name: Boot iOS simulator
        run: |
          set -euo pipefail
          simulator_id="$(./scripts/maestro/select-ios-simulator.sh)"
          echo "CAPGO_MAESTRO_IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id" >/dev/null 2>&1 || true
      - name: Run live update Maestro flows
        run: |
          set -euo pipefail
          CAPGO_MAESTRO_SKIP_BUILD=1 \
          CAPGO_MAESTRO_SKIP_BUNDLE_BUILD=1 \
          CAPGO_MAESTRO_IOS_ASSUME_CLEAN_INSTALL=1 \
          CAPGO_MAESTRO_IOS_APP_PATH=maestro-ios-apps/${{ matrix.scenario }}/App.app \
          CAPGO_MAESTRO_RESULTS_DIR=maestro-results-ios-live-update/${{ matrix.scenario }} \
          CAPGO_MAESTRO_TIMEOUT_SECONDS=300 \
          CAPGO_MAESTRO_TEST_RETRIES=2 \
          MAESTRO_DRIVER_STARTUP_TIMEOUT=180000 \
          ./scripts/maestro/run-ios-live-update.sh "${{ matrix.scenario }}"
      - name: Collect iOS crash reports
        if: failure()
        timeout-minutes: 1
        run: |
          mkdir -p "maestro-results-ios-live-update/${{ matrix.scenario }}/crash-reports"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 2 -type f \( -name 'App*.ips' -o -name 'App*.crash' \) -exec cp {} "maestro-results-ios-live-update/${{ matrix.scenario }}/crash-reports/" \; 2>/dev/null || true
      - name: Upload live update Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-ios-live-update-${{ matrix.scenario }}
          path: maestro-results-ios-live-update/${{ matrix.scenario }}

  # Built separately from maestro_ios_apps so both builds stay under the 10 minute job cap.
  maestro_ios_edge_apps:
    permissions:
      contents: read
      actions: write
    needs: maestro_web_assets
    timeout-minutes: 10
    runs-on: macOS-latest
    name: Build iOS Maestro edge case apps
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Download reusable Maestro web assets
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Build Rust core (iOS)
        uses: ./.github/actions/build-core
        with:
          platform: ios
      - name: Build iOS apps
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/maestro-ios-edge-apps"
          derived_data_path="$RUNNER_TEMP/maestro-ios-derived"
          scenarios=(
            edge-deferred
            edge-direct
          )

          rm -rf "$artifact_root" "$derived_data_path"
          mkdir -p "$artifact_root"

          for scenario in "${scenarios[@]}"; do
            app_artifact_path="$artifact_root/$scenario"
            bun scripts/maestro/prepare-ios-scenario.mjs "$scenario"
            xcodebuild \
              -project example-app/ios/App/App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath "$derived_data_path" \
              build
            mkdir -p "$app_artifact_path"
            ditto "$derived_data_path/Build/Products/Debug-iphonesimulator/App.app" "$app_artifact_path/App.app"
          done
      - name: Upload iOS apps
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-edge-apps
          path: ${{ runner.temp }}/maestro-ios-edge-apps
          if-no-files-found: error

  maestro_ios_edge_cases:
    permissions:
      contents: read
      actions: write
    needs:
      - maestro_web_assets
      - maestro_ios_edge_apps
    timeout-minutes: 10
    runs-on: macOS-latest
    name: iOS example app Maestro edge case / ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: edge-network-drop
            app: edge-deferred
          - scenario: edge-kill-download
            app: edge-deferred
          - scenario: edge-corrupt-bundle
            app: edge-deferred
          - scenario: edge-offline-check
            app: edge-deferred
          - scenario: edge-direct-network-drop
            app: edge-direct
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Boot in the background so it overlaps the setup steps; the runner waits on bootstatus.
      # A full edge case needs most of the 10 minute cap, so a blocking boot can push it over.
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-dependencies: 'false'
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Download reusable Maestro web assets
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Download iOS app
        uses: actions/download-artifact@v8
        with:
          name: maestro-ios-edge-apps
          path: maestro-ios-edge-apps
      # A full case takes most of the 10 minute cap on hosted macOS runners, so no case-level retry here.
      # The single recovery flow includes the XCTest driver startup (up to ~2 minutes), hence 360s.
      # Boot after the setup steps: a booting simulator starves them of CPU (Bun and Maestro
      # setup took 2-4 minutes during the boot and ~20 s without it).
      - name: Boot iOS simulator
        run: |
          set -euo pipefail
          simulator_id="$(./scripts/maestro/select-ios-simulator.sh)"
          echo "CAPGO_MAESTRO_IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id" >/dev/null 2>&1 || true
      - name: Run edge case Maestro flows
        run: |
          set -euo pipefail
          CAPGO_MAESTRO_SKIP_BUILD=1 \
          CAPGO_MAESTRO_SKIP_BUNDLE_BUILD=1 \
          CAPGO_MAESTRO_IOS_ASSUME_CLEAN_INSTALL=1 \
          CAPGO_MAESTRO_IOS_APP_PATH=maestro-ios-edge-apps/${{ matrix.app }}/App.app \
          CAPGO_MAESTRO_RESULTS_DIR=maestro-results-ios-live-update/${{ matrix.scenario }} \
          CAPGO_MAESTRO_TIMEOUT_SECONDS=360 \
          CAPGO_MAESTRO_EDGE_CASE_RETRIES=1 \
          MAESTRO_DRIVER_STARTUP_TIMEOUT=180000 \
          ./scripts/maestro/run-ios-live-update.sh "${{ matrix.scenario }}"
      - name: Collect iOS crash reports
        if: failure()
        timeout-minutes: 1
        run: |
          mkdir -p "maestro-results-ios-live-update/${{ matrix.scenario }}/crash-reports"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 2 -type f \( -name 'App*.ips' -o -name 'App*.crash' \) -exec cp {} "maestro-results-ios-live-update/${{ matrix.scenario }}/crash-reports/" \; 2>/dev/null || true
      - name: Upload edge case Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-ios-edge-${{ matrix.scenario }}
          path: maestro-results-ios-live-update/${{ matrix.scenario }}

  web:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Build code and test
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Self-test LTS constraint restore
        run: bun .github/scripts/restore-lts-constraints.mjs --self-test
      - name: Lint
        id: lint_code
        run: bun run eslint && bun run prettier -- --check
      - name: Build
        id: build_code
        run: bun run build
      - name: Verify packed package in example app (Web)
        shell: bash
        run: CAPGO_VERIFY_PACKED_SKIP_BUILD=1 bash ./.github/scripts/verify-packed-example.sh web

  maestro_android_scenarios:
    permissions:
      contents: read
      actions: read
    needs:
      - maestro_web_assets
      - maestro_android_apps
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: maestro_android / ${{ matrix.scenario }}
    env:
      CAPGO_MAESTRO_SUCCESS_MARKER: ${{ github.workspace }}/maestro-android-live-update.pass
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - deferred
          - always
          - legacy-true
          - at-install
          - on-launch
          - manual-zip-config-guards
          - manual-manifest
        # Edge cases share one app build per app scenario and inject failures via the fake server.
        include:
          - scenario: edge-network-drop
            app: edge-deferred
          - scenario: edge-kill-download
            app: edge-deferred
          - scenario: edge-corrupt-bundle
            app: edge-deferred
          - scenario: edge-offline-check
            app: edge-deferred
          - scenario: edge-direct-network-drop
            app: edge-direct
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Download reusable Maestro web assets (attempt 1)
        id: download_maestro_web_assets_1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before retrying Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 2)
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        id: download_maestro_web_assets_2
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before final Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 3)
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Download Android app (attempt 1)
        id: download_android_app_1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-android-app-${{ matrix.app || matrix.scenario }}
          path: example-app/android/app/build/outputs/apk/debug
      - name: Wait before retrying Android app download
        if: steps.download_android_app_1.outcome == 'failure'
        run: sleep 15
      - name: Download Android app (attempt 2)
        if: steps.download_android_app_1.outcome == 'failure'
        id: download_android_app_2
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-android-app-${{ matrix.app || matrix.scenario }}
          path: example-app/android/app/build/outputs/apk/debug
      - name: Wait before final Android app download
        if: steps.download_android_app_1.outcome == 'failure' && steps.download_android_app_2.outcome == 'failure'
        run: sleep 15
      - name: Download Android app (attempt 3)
        if: steps.download_android_app_1.outcome == 'failure' && steps.download_android_app_2.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: maestro-android-app-${{ matrix.app || matrix.scenario }}
          path: example-app/android/app/build/outputs/apk/debug
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The runner action tears the emulator down inside this step, and that teardown can hang
      # for minutes after the flow already passed (an orphaned crashpad_handler keeps the pipe
      # open). Bound the step below the job cap and let the success marker decide the result,
      # so a hung teardown cannot burn the whole 10 minutes or fail a passing scenario.
      - name: Run live update Maestro flow
        timeout-minutes: 8
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: >-
            CAPGO_MAESTRO_SKIP_BUILD=1
            CAPGO_MAESTRO_SKIP_BUNDLE_BUILD=1
            MAESTRO_FLOW_TIMEOUT_SECONDS=300
            CAPGO_MAESTRO_FLOW_RETRIES=2
            CAPGO_MAESTRO_SPLIT_RETRIES=2
            CAPGO_MAESTRO_UI_STATE_TIMEOUT_SECONDS=180
            CAPGO_MAESTRO_DIRECT_UPDATE_SETTLE_TIMEOUT_SECONDS=180
            bash ./scripts/maestro/run-android-live-update-ci.sh "${{ matrix.scenario }}"
      - name: Verify live update scenario passed
        run: |
          if [[ ! -f "$CAPGO_MAESTRO_SUCCESS_MARKER" ]]; then
            echo "Android live update Maestro scenario '${{ matrix.scenario }}' did not pass."
            exit 1
          fi
          echo "Android live update Maestro scenario '${{ matrix.scenario }}' passed."
      - name: Upload fake Capgo server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-server-log-${{ matrix.scenario }}
          path: .maestro-artifacts/fake-capgo-server.log
          if-no-files-found: ignore

  maestro_android:
    if: always()
    needs:
      - maestro_android_scenarios
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any live update scenario fails
        run: |
          if [[ "${{ needs.maestro_android_scenarios.result }}" != "success" ]]; then
            echo "One or more Android live update Maestro scenarios failed."
            exit 1
          fi
