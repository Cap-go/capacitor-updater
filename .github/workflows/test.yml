name: Build source code and test it

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - renovate/**
  pull_request:
    branches: [main, v5, v6, v7]
  workflow_dispatch:
  workflow_call: # Allow this workflow to be called by other workflows

env:
  BUN_VERSION: 1.4.2
  MAESTRO_VERSION: cli-2.4.0
  CAPGO_MAESTRO_DEVICE_BASE_URL: http://127.0.0.1:3192

permissions: {}

jobs:
  check_wiring:
    permissions:
      contents: read
    timeout-minutes: 10
    name: check:wiring / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Setup Node.js
        if: runner.os == 'Windows'
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Check plugin wiring
        if: runner.os != 'Windows'
        run: bun run check:wiring
      - name: Check Maestro teardown handling
        if: runner.os != 'Windows'
        run: |
          python3 scripts/maestro/test-run-maestro.py
          bash scripts/maestro/test-server-lifecycle.sh
          python3 scripts/maestro/test-device-animations.py
          python3 scripts/maestro/test-ios-flow-artifacts.py
      - name: Check plugin wiring (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/check-capacitor-plugin-wiring.mjs && node scripts/test-builtin-hashes-hook.mjs

  guard_swiftpm_version:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enforce capacitor-swift-pm version
        run: |
          set -euo pipefail
          MAJOR=$(awk -F'"' '/"version":/{print $4; exit}' package.json | cut -d. -f1)
          if ! grep -Eq "https://github.com/ionic-team/capacitor-swift-pm\\.git\"[[:space:]]*,[[:space:]]*from:[[:space:]]*\"${MAJOR}\\.0\\.0\"" Package.swift; then
            echo "Expected capacitor-swift-pm to be pinned to ${MAJOR}.0.0 in Package.swift"
            exit 1
          fi

  build_android:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Build plugin bundle
        run: bun run build
      - name: Build and test Android plugin
        id: build_code
        run: bun run verify:android
      - name: Verify packed package in example app (Android)
        shell: bash
        run: CAPGO_VERIFY_PACKED_SKIP_BUILD=1 CAPGO_VERIFY_PACKED_RELEASE_ANDROID=1 bash ./.github/scripts/verify-packed-example.sh android
      - name: Decrypt bundles freshly encrypted by the latest Capgo CLI
        # The committed fixtures ran above; also check compatibility with the current CLI release.
        run: |
          bun add --no-save @capgo/cli@latest
          bunx --no-install capgo --version
          bun run generate:cli-crypto
          bun run native:contract:cli:android

  build_android_next_capacitor:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Use the next Capacitor Android release
        run: |
          bun add --no-save @capacitor/android@next
          node -p "'@capacitor/android ' + require('@capacitor/android/package.json').version"
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Install the Android platform that Capacitor next compiles against
        # AGP does not see a platform that it downloads in the same run, so install it first.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Compile Android plugin and unit tests against Capacitor next
        working-directory: android
        run: ./gradlew compileDebugUnitTestJavaWithJavac

  build_ios:
    permissions:
      contents: read
    # Hard cap: keep every iOS job under 5 minutes. Never raise it; make the job faster instead.
    timeout-minutes: 5
    runs-on: macOS-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ runner.temp }}/ios-device-dd
          key: ${{ runner.os }}-ios-device-${{ hashFiles('Package.swift', 'Package.resolved', 'ios/Sources/**', 'ios/Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-ios-device-
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Build plugin bundle
        id: build_code
        run: bun run build
      - name: Build iOS plugin
        run: bun run verify:ios -derivedDataPath "$RUNNER_TEMP/ios-device-dd"

  verify_packed_ios:
    permissions:
      contents: read
    # Hard cap: keep every iOS job under 5 minutes. Never raise it; make the job faster instead.
    timeout-minutes: 5
    runs-on: macOS-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Build plugin bundle
        run: bun run build
      - name: Verify packed package in example app (iOS)
        shell: bash
        run: CAPGO_VERIFY_PACKED_SKIP_BUILD=1 bash ./.github/scripts/verify-packed-example.sh ios

  test_ios_setup:
    permissions:
      contents: read
    timeout-minutes: 10
    runs-on: macOS-latest
    env:
      CAPGO_IOS_DERIVED_DATA: ${{ github.workspace }}/.ci-ios-test-dd
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift', 'Package.resolved', 'ios/Sources/**', 'ios/Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-
      - name: Build iOS tests once
        run: CAPGO_IOS_TEST_ACTION=build-for-testing ./scripts/test-ios.sh
      - name: Encrypt fresh bundles with the latest Capgo CLI
        run: |
          bun add --no-save @capgo/cli@latest
          bunx --no-install capgo --version
          bun run generate:cli-crypto native-contract-tests/cli-fresh
      - name: Upload iOS test build and CLI fresh fixtures (attempt 1)
        id: upload_ios_test_build_1
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-build
          path: |
            .ci-ios-test-dd
            native-contract-tests/cli-fresh
          include-hidden-files: true
          if-no-files-found: error
      - name: Wait before retrying iOS test build upload
        if: steps.upload_ios_test_build_1.outcome == 'failure'
        run: sleep 15
      - name: Upload iOS test build and CLI fresh fixtures (attempt 2)
        if: steps.upload_ios_test_build_1.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-build
          overwrite: true
          path: |
            .ci-ios-test-dd
            native-contract-tests/cli-fresh
          include-hidden-files: true
          if-no-files-found: error

  test_ios:
    needs: test_ios_setup
    permissions:
      contents: read
    # Hard cap: keep every iOS job under 5 minutes. Never raise it; make the job faster instead.
    timeout-minutes: 5
    runs-on: macOS-latest
    name: test_ios / ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # -only-testing:CapacitorUpdaterPluginTests/CapacitorUpdaterTests
          # Interleave core tests across three shards to leave room for simulator startup and result finalization.
          - shard: core-a
            parallel_testing: '0'
            select_cmd: scripts/ci/ios-capacitor-updater-core-shard-args.sh a
          - shard: core-b
            parallel_testing: '0'
            select_cmd: scripts/ci/ios-capacitor-updater-core-shard-args.sh b
          - shard: core-c
            parallel_testing: '0'
            select_cmd: scripts/ci/ios-capacitor-updater-core-shard-args.sh c
          # PopulateDeltaCacheTests and its companion classes in PopulateDeltaCacheTests.swift need long IO and can push a single "rest" shard past the 5 minute cap; run them alone.
          - shard: delta
            parallel_testing: '0'
            select: -only-testing:CapacitorUpdaterPluginTests/PopulateDeltaCacheTests -only-testing:CapacitorUpdaterPluginTests/IoBufferSizeTests -only-testing:CapacitorUpdaterPluginTests/ManifestConcurrencyTests -only-testing:CapacitorUpdaterPluginTests/StreamDecodeTests -only-testing:CapacitorUpdaterPluginTests/ImmutableCacheLinkTests
          - shard: rest-a
            parallel_testing: '0'
            select: >-
              -only-testing:CapacitorUpdaterPluginTests/BuiltinHashesTests
              -only-testing:CapacitorUpdaterPluginTests/BundleHardeningTests
              -only-testing:CapacitorUpdaterPluginTests/CapgoSemanticVersionTests
              -only-testing:CapacitorUpdaterPluginTests/ChecksumRequiredTests
          - shard: rest-b
            parallel_testing: '0'
            select: >-
              -only-testing:CapacitorUpdaterPluginTests/CliCryptoFixtureTests
              -only-testing:CapacitorUpdaterPluginTests/HttpsOnlyBuiltinMinimumTests
              -only-testing:CapacitorUpdaterPluginTests/ListChannelsTests
              -only-testing:CapacitorUpdaterPluginTests/LoggerSecurityTests
              -only-testing:CapacitorUpdaterPluginTests/WebKitOverlayGuardTests
          - shard: rest-c
            parallel_testing: '0'
            select: >-
              -only-testing:CapacitorUpdaterPluginTests/NativeContractTests
              -only-testing:CapacitorUpdaterPluginTests/NetworkTransportTests
              -only-testing:CapacitorUpdaterPluginTests/RedirectPolicyTests
              -only-testing:CapacitorUpdaterPluginTests/RsaContractTests
          - shard: rest-d
            parallel_testing: '0'
            select: >-
              -only-testing:CapacitorUpdaterPluginTests/SessionKeyRequiredTests
              -only-testing:CapacitorUpdaterPluginTests/UpdateLifecycleTests
              -only-testing:CapacitorUpdaterPluginTests/ZipArchiveReaderTests
              -only-testing:CapacitorUpdaterPluginTests/ZipBundleExtractionTests
    env:
      CAPGO_IOS_DERIVED_DATA: ${{ github.workspace }}/.ci-ios-test-dd
      CAPGO_IOS_PARALLEL_TESTING: ${{ matrix.parallel_testing }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        # Only the core shard selector invokes Node; other shards run prebuilt Swift tests directly.
        if: matrix.select_cmd != ''
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          setup-node: 'false'
          install-dependencies: 'false'
      - name: Download iOS test build and CLI fresh fixtures
        uses: actions/download-artifact@v8
        with:
          name: ios-test-build
          path: .
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift', 'Package.resolved', 'ios/Sources/**', 'ios/Tests/**') }}
      - name: Run iOS native tests (${{ matrix.shard }})
        id: test_ios
        run: |
          set -euo pipefail
          if [[ -n "${{ matrix.select_cmd }}" ]]; then
            select_args=()
            select_cmd_output=""
            if ! select_cmd_output=$(./${{ matrix.select_cmd }}); then
              echo "select_cmd failed: ./${{ matrix.select_cmd }}"
              exit 1
            fi
            while IFS= read -r arg; do
              [[ -n "$arg" ]] && select_args+=("$arg")
            done <<< "$select_cmd_output"
            if [[ ${#select_args[@]} -eq 0 ]]; then
              echo "select_cmd produced no -only-testing arguments"
              exit 1
            fi
            CAPGO_IOS_TEST_ACTION=test-without-building ./scripts/test-ios.sh "${select_args[@]}"
          else
            CAPGO_IOS_TEST_ACTION=test-without-building ./scripts/test-ios.sh ${{ matrix.select }}
          fi
      - name: Upload failed iOS native test results
        if: failure() && steps.test_ios.outcome == 'failure'
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-results-${{ matrix.shard }}
          path: .ci-ios-test-dd/Logs/Test
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  maestro_web_assets:
    permissions:
      contents: read
      actions: write
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Build Maestro web assets
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Build reusable Maestro web assets
        run: bun scripts/maestro/build-bundles.mjs all
      - name: Upload reusable Maestro web assets (attempt 1)
        id: upload_maestro_web_assets_1
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-web-assets
          path: |
            dist
            .maestro-artifacts
          include-hidden-files: true
          if-no-files-found: error
      - name: Wait before retrying Maestro web assets upload
        if: steps.upload_maestro_web_assets_1.outcome == 'failure'
        run: sleep 15
      - name: Upload reusable Maestro web assets (attempt 2)
        if: steps.upload_maestro_web_assets_1.outcome == 'failure'
        id: upload_maestro_web_assets_2
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-web-assets
          overwrite: true
          path: |
            dist
            .maestro-artifacts
          include-hidden-files: true
          if-no-files-found: error
      - name: Wait before final Maestro web assets upload
        if: steps.upload_maestro_web_assets_1.outcome == 'failure' && steps.upload_maestro_web_assets_2.outcome == 'failure'
        run: sleep 15
      - name: Upload reusable Maestro web assets (attempt 3)
        if: steps.upload_maestro_web_assets_1.outcome == 'failure' && steps.upload_maestro_web_assets_2.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: maestro-web-assets
          overwrite: true
          path: |
            dist
            .maestro-artifacts
          include-hidden-files: true
          if-no-files-found: error

  maestro_android_apps:
    permissions:
      contents: read
      actions: write
    needs: maestro_web_assets
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Build Android Maestro app / ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - deferred
          - always
          - legacy-true
          - at-install
          - on-launch
          - manual-zip
          - manual-zip-no-persist
          - manual-zip-config-guards
          - manual-manifest
          - edge-deferred
          - edge-direct
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Download reusable Maestro web assets (attempt 1)
        id: download_maestro_web_assets_1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before retrying Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 2)
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        id: download_maestro_web_assets_2
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before final Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 3)
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Build Android app
        run: bun scripts/maestro/prepare-android-scenario.mjs "${{ matrix.scenario }}"
      - name: Upload Android app (attempt 1)
        id: upload_android_app_1
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-app-${{ matrix.scenario }}
          path: example-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Wait before retrying Android app upload
        if: steps.upload_android_app_1.outcome == 'failure'
        run: sleep 15
      - name: Upload Android app (attempt 2)
        if: steps.upload_android_app_1.outcome == 'failure'
        id: upload_android_app_2
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-app-${{ matrix.scenario }}
          overwrite: true
          path: example-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Wait before final Android app upload
        if: steps.upload_android_app_1.outcome == 'failure' && steps.upload_android_app_2.outcome == 'failure'
        run: sleep 15
      - name: Upload Android app (attempt 3)
        if: steps.upload_android_app_1.outcome == 'failure' && steps.upload_android_app_2.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-app-${{ matrix.scenario }}
          overwrite: true
          path: example-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  maestro_ios_apps:
    permissions:
      contents: read
      actions: write
    needs: maestro_web_assets
    timeout-minutes: 10
    runs-on: macOS-latest
    name: Build iOS Maestro apps
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Download reusable Maestro web assets (attempt 1)
        id: download_maestro_web_assets_1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before retrying Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 2)
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        id: download_maestro_web_assets_2
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before final Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 3)
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Build iOS app
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/maestro-ios-runtime"
          derived_data_path="$RUNNER_TEMP/maestro-ios-derived"
          scenarios=(
            deferred
            always
            legacy-true
            at-install
            on-launch
            manual-zip
            manual-zip-no-persist
            manual-zip-config-guards
            manual-manifest
          )

          rm -rf "$artifact_root" "$derived_data_path"
          mkdir -p "$artifact_root/maestro-ios-apps"

          for scenario in "${scenarios[@]}"; do
            bun scripts/maestro/prepare-ios-scenario.mjs "$scenario"
            xcodebuild \
              -project example-app/ios/App/App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath "$derived_data_path" \
              build
            tar -czf "$artifact_root/maestro-ios-apps/$scenario.tar.gz" \
              -C "$derived_data_path/Build/Products/Debug-iphonesimulator" App.app
          done
          # Restore each app and its matching fixtures in one artifact download.
