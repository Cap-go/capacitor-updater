  # Built separately from maestro_ios_apps so both builds stay under the 10 minute job cap.
  maestro_ios_edge_apps:
    permissions:
      contents: read
      actions: write
    needs: maestro_web_assets
    timeout-minutes: 10
    runs-on: macOS-latest
    name: Build iOS Maestro edge case apps
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Download reusable Maestro web assets
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Build iOS apps
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/maestro-ios-edge-apps"
          derived_data_path="$RUNNER_TEMP/maestro-ios-derived"
          scenarios=(
            edge-deferred
            edge-direct
          )

          rm -rf "$artifact_root" "$derived_data_path"
          mkdir -p "$artifact_root"

          # Reuse the build job's Bun so each edge job avoids a separate runtime cache restore.
          mkdir -p "$artifact_root/runtime"
          cp -L "$(command -v bun)" "$artifact_root/runtime/bun"
          ln -s bun "$artifact_root/runtime/bunx"
          tar -czf "$artifact_root/bun-runtime.tar.gz" -C "$artifact_root" runtime

          for scenario in "${scenarios[@]}"; do
            bun scripts/maestro/prepare-ios-scenario.mjs "$scenario"
            xcodebuild \
              -project example-app/ios/App/App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath "$derived_data_path" \
              build
            mkdir -p "$artifact_root/$scenario"
            ditto "$derived_data_path/Build/Products/Debug-iphonesimulator/App.app" "$artifact_root/$scenario/App.app"
            # Ship one archive per scenario, including the web fixtures needed by the fake server.
            tar -czf "$artifact_root/$scenario.tar.gz" \
              -C "$RUNNER_TEMP" "maestro-ios-edge-apps/$scenario/App.app" \
              -C "$GITHUB_WORKSPACE" dist .maestro-artifacts
          done
      - name: Upload iOS apps
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-edge-apps
          path: ${{ runner.temp }}/maestro-ios-edge-apps/*.tar.gz
          compression-level: 0
          if-no-files-found: error

  maestro_ios_edge_cases:
    permissions:
      contents: read
      actions: write
    needs:
      - maestro_ios_edge_apps
    timeout-minutes: 10
    runs-on: macOS-latest
    env:
      CAPGO_MAESTRO_IOS_SKIP_BOOT: '1'
    name: iOS example app Maestro edge case / ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: edge-network-drop
            app: edge-deferred
            edge_case_retries: 1
          - scenario: edge-kill-download
            app: edge-deferred
            edge_case_retries: 1
          - scenario: edge-corrupt-bundle
            app: edge-deferred
            edge_case_retries: 1
          - scenario: edge-offline-check
            app: edge-deferred
            edge_case_retries: 1
          - scenario: edge-direct-network-drop
            app: edge-direct
            edge_case_retries: 1
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Boot iOS simulator early
        run: |
          set -euo pipefail
          simulator_id="$(./scripts/maestro/select-ios-simulator.sh)"
          echo "CAPGO_MAESTRO_IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id" >/dev/null 2>&1 || true
      - name: Download iOS apps and Bun runtime
        uses: actions/download-artifact@v8
        with:
          name: maestro-ios-edge-apps
          path: maestro-ios-edge-apps
      - name: Restore Bun runtime from app artifact
        run: |
          set -euo pipefail
          tar -xzf maestro-ios-edge-apps/bun-runtime.tar.gz -C maestro-ios-edge-apps
          runtime_bin="$GITHUB_WORKSPACE/maestro-ios-edge-apps/runtime"
          test "$("$runtime_bin/bun" --version)" = "$BUN_VERSION"
          echo "$runtime_bin" >> "$GITHUB_PATH"
          "$runtime_bin/bun" --revision
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Extract selected iOS app
        env:
          APP_SCENARIO: ${{ matrix.app }}
        run: |
          tar -xzf "maestro-ios-edge-apps/$APP_SCENARIO.tar.gz" -C .
      - name: Wait for iOS simulator boot
        run: xcrun simctl bootstatus "$CAPGO_MAESTRO_IOS_SIMULATOR_ID" -b
      - name: Run edge case Maestro flows
        run: |
          set -euo pipefail
          CAPGO_MAESTRO_SKIP_BUILD=1 \
          CAPGO_MAESTRO_SKIP_BUNDLE_BUILD=1 \
          CAPGO_MAESTRO_IOS_ASSUME_CLEAN_INSTALL=1 \
          CAPGO_MAESTRO_IOS_APP_PATH=maestro-ios-edge-apps/${{ matrix.app }}/App.app \
          CAPGO_MAESTRO_RESULTS_DIR=maestro-results-ios-live-update/${{ matrix.scenario }} \
          CAPGO_MAESTRO_TIMEOUT_SECONDS=300 \
          CAPGO_MAESTRO_EDGE_CASE_RETRIES=${{ matrix.edge_case_retries }} \
          CAPGO_MAESTRO_IOS_BOOT_WAIT_SECONDS=45 \
          CAPGO_MAESTRO_FAST_SERVER_POLL=1 \
          MAESTRO_DRIVER_STARTUP_TIMEOUT=120000 \
          ./scripts/maestro/run-ios-live-update.sh "${{ matrix.scenario }}"
      - name: Upload edge case Maestro artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-ios-edge-${{ matrix.scenario }}
          path: maestro-results-ios-live-update/${{ matrix.scenario }}

  web:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Build code and test
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Self-test LTS constraint restore
        run: bun .github/scripts/restore-lts-constraints.mjs --self-test
      - name: Lint
        id: lint_code
        run: bun run eslint && bun run prettier -- --check
      - name: Build
        id: build_code
        run: bun run build
      - name: Verify packed package in example app (Web)
        shell: bash
        run: CAPGO_VERIFY_PACKED_SKIP_BUILD=1 bash ./.github/scripts/verify-packed-example.sh web

  maestro_android_scenarios:
    permissions:
      contents: read
      actions: read
    needs:
      - maestro_web_assets
      - maestro_android_apps
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: maestro_android / ${{ matrix.scenario }}
    env:
      CAPGO_MAESTRO_SUCCESS_MARKER: ${{ github.workspace }}/maestro-android-live-update.pass
    strategy:
