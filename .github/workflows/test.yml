name: Build source code and test it

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - renovate/**
  pull_request:
    branches: [main, v5, v6, v7]
  workflow_dispatch:
  workflow_call: # Allow this workflow to be called by other workflows

env:
  BUN_VERSION: 1.4.2
  MAESTRO_VERSION: cli-2.4.0
  CAPGO_MAESTRO_DEVICE_BASE_URL: http://127.0.0.1:3192

permissions: {}

jobs:
  check_wiring:
    permissions:
      contents: read
    timeout-minutes: 10
    name: check:wiring / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Setup Node.js
        if: runner.os == 'Windows'
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Check plugin wiring
        if: runner.os != 'Windows'
        run: bun run check:wiring
      - name: Check plugin wiring (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/check-capacitor-plugin-wiring.mjs && node scripts/test-builtin-hashes-hook.mjs

  guard_swiftpm_version:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enforce capacitor-swift-pm version
        run: |
          set -euo pipefail
          MAJOR=$(awk -F'"' '/"version":/{print $4; exit}' package.json | cut -d. -f1)
          if ! grep -Eq "https://github.com/ionic-team/capacitor-swift-pm\\.git\"[[:space:]]*,[[:space:]]*from:[[:space:]]*\"${MAJOR}\\.0\\.0\"" Package.swift; then
            echo "Expected capacitor-swift-pm to be pinned to ${MAJOR}.0.0 in Package.swift"
            exit 1
          fi

  build_android:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Build plugin bundle
        run: bun run build
      - name: Build and test Android plugin
        id: build_code
        run: bun run verify:android
      - name: Verify packed package in example app (Android)
        shell: bash
        run: CAPGO_VERIFY_PACKED_SKIP_BUILD=1 bash ./.github/scripts/verify-packed-example.sh android
      - name: Decrypt bundles freshly encrypted by the pinned Capgo CLI
        # The committed fixtures ran above; this re-encrypts with the CLI so every CLI bump is re-checked.
        run: bun run generate:cli-crypto && bun run native:contract:cli:android

  build_android_next_capacitor:
    permissions:
      contents: read
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Use the next Capacitor Android release
        run: |
          bun add --no-save @capacitor/android@next
          node -p "'@capacitor/android ' + require('@capacitor/android/package.json').version"
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Install the Android platform that Capacitor next compiles against
        # AGP does not see a platform that it downloads in the same run, so install it first.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Compile Android plugin and unit tests against Capacitor next
        working-directory: android
        run: ./gradlew compileDebugUnitTestJavaWithJavac

  build_ios:
    permissions:
      contents: read
    # Hard cap: keep every iOS job under 5 minutes. Never raise it; make the job faster instead.
    timeout-minutes: 5
    runs-on: macOS-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ runner.temp }}/ios-device-dd
          key: ${{ runner.os }}-ios-device-${{ hashFiles('Package.swift', 'Package.resolved', 'ios/Sources/**', 'ios/Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-ios-device-
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Check Cap 9 deprecated APIs
        run: bun run check:cap9-deprecated
      - name: Build plugin bundle
        id: build_code
        run: bun run build
      - name: Build iOS plugin
        run: bun run verify:ios -derivedDataPath "$RUNNER_TEMP/ios-device-dd"

  verify_packed_ios:
    permissions:
      contents: read
    # Hard cap: keep every iOS job under 5 minutes. Never raise it; make the job faster instead.
    timeout-minutes: 5
    runs-on: macOS-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Build plugin bundle
        run: bun run build
      - name: Verify packed package in example app (iOS)
        shell: bash
        run: CAPGO_VERIFY_PACKED_SKIP_BUILD=1 bash ./.github/scripts/verify-packed-example.sh ios

  test_ios_build:
    permissions:
      contents: read
    # Keep compilation separate from simulator startup and test teardown under the same hard cap.
    timeout-minutes: 5
    runs-on: macOS-latest
    name: Build iOS native tests
    env:
      CAPGO_IOS_DERIVED_DATA: ${{ github.workspace }}/.ci-ios-test-dd
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          setup-node: 'false'
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .ci-ios-test-dd
          key: ${{ runner.os }}-ios-test-${{ hashFiles('Package.swift', 'Package.resolved', 'ios/Sources/**', 'ios/Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-ios-test-
      - name: Build iOS tests once
        run: |
          # Cached manifests may target an older SDK. Regenerate only the current build's test manifest.
          rm -f "$CAPGO_IOS_DERIVED_DATA"/Build/Products/*.xctestrun
          CAPGO_IOS_TEST_ACTION=build-for-testing ./scripts/test-ios.sh
      - name: Encrypt fresh bundles with the pinned Capgo CLI
        # CliCryptoFixtureTests checks the committed fixtures and this fresh set in the same run,
        # so every CLI bump is re-checked without a second xcodebuild launch.
        run: bun run generate:cli-crypto native-contract-tests/cli-fresh
      - name: Archive compiled iOS tests
        run: |
          xctestrun_files=("$CAPGO_IOS_DERIVED_DATA"/Build/Products/*.xctestrun)
          if [[ ${#xctestrun_files[@]} -ne 1 || ! -f "${xctestrun_files[0]}" ]]; then
            echo "Expected exactly one compiled iOS test manifest" >&2
            exit 1
          fi
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/ios-native-test-products.tar.gz" -C "$CAPGO_IOS_DERIVED_DATA/Build" Products
      - name: Archive fresh Capgo CLI fixtures
        run: COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/ios-native-cli-fixtures.tar.gz" -C "$GITHUB_WORKSPACE" native-contract-tests/cli-fresh
      - name: Upload compiled iOS tests
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-test-products
          path: |
            ${{ runner.temp }}/ios-native-test-products.tar.gz
            ${{ runner.temp }}/ios-native-cli-fixtures.tar.gz
          compression-level: 0
          retention-days: 1

  test_ios:
    permissions:
      contents: read
    needs: test_ios_build
    # Hard cap: keep every iOS job under 5 minutes. Never raise it; make the job faster instead.
    # Diagnose timing with bun scripts/ci/report-ios-job-budget.mjs <run-id>.
    timeout-minutes: 5
    runs-on: macOS-latest
    name: test_ios / ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CapacitorUpdaterTests alone is about 90s of runtime, so it gets its own shard.
          - shard: core
            select: -only-testing:CapacitorUpdaterPluginTests/CapacitorUpdaterTests
            cli_contract: false
          # Real URLSession transport tests can dominate the remaining runtime on hosted simulators.
          - shard: network
            select: -only-testing:CapacitorUpdaterPluginTests/NetworkTransportTests
            cli_contract: false
          - shard: rest
            select: -skip-testing:CapacitorUpdaterPluginTests/CapacitorUpdaterTests -skip-testing:CapacitorUpdaterPluginTests/NetworkTransportTests
            cli_contract: true
    env:
      CAPGO_IOS_DERIVED_DATA: ${{ github.workspace }}/.ci-ios-test-dd
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download compiled iOS tests
        uses: actions/download-artifact@v8
        with:
          name: ios-native-test-products
          path: ${{ runner.temp }}/ios-native-test-products
      - name: Extract compiled iOS tests
        run: |
          mkdir -p "$CAPGO_IOS_DERIVED_DATA/Build"
          tar -xzf "$RUNNER_TEMP/ios-native-test-products/ios-native-test-products.tar.gz" -C "$CAPGO_IOS_DERIVED_DATA/Build"
          xctestrun_files=("$CAPGO_IOS_DERIVED_DATA"/Build/Products/*.xctestrun)
          if [[ ${#xctestrun_files[@]} -ne 1 || ! -f "${xctestrun_files[0]}" ]]; then
            echo "Expected exactly one compiled iOS test manifest" >&2
            exit 1
          fi
          echo "CAPGO_IOS_XCTESTRUN=${xctestrun_files[0]}" >> "$GITHUB_ENV"
      - name: Extract fresh Capgo CLI fixtures
        if: matrix.cli_contract
        run: tar -xzf "$RUNNER_TEMP/ios-native-test-products/ios-native-cli-fixtures.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Run iOS native tests (${{ matrix.shard }})
        id: test_ios
        run: CAPGO_IOS_TEST_ACTION=test-without-building ./scripts/test-ios.sh ${{ matrix.select }}

  maestro_web_assets:
    permissions:
      contents: read
      actions: write
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Build Maestro web assets
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Build reusable Maestro web assets
        run: bun scripts/maestro/build-bundles.mjs all
      - name: Upload reusable Maestro web assets (attempt 1)
        id: upload_maestro_web_assets_1
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-web-assets
          path: |
            dist
            .maestro-artifacts
          include-hidden-files: true
          if-no-files-found: error
      - name: Wait before retrying Maestro web assets upload
        if: steps.upload_maestro_web_assets_1.outcome == 'failure'
        run: sleep 15
      - name: Upload reusable Maestro web assets (attempt 2)
        if: steps.upload_maestro_web_assets_1.outcome == 'failure'
        id: upload_maestro_web_assets_2
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-web-assets
          overwrite: true
          path: |
            dist
            .maestro-artifacts
          include-hidden-files: true
          if-no-files-found: error
      - name: Wait before final Maestro web assets upload
        if: steps.upload_maestro_web_assets_1.outcome == 'failure' && steps.upload_maestro_web_assets_2.outcome == 'failure'
        run: sleep 15
      - name: Upload reusable Maestro web assets (attempt 3)
        if: steps.upload_maestro_web_assets_1.outcome == 'failure' && steps.upload_maestro_web_assets_2.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: maestro-web-assets
          overwrite: true
          path: |
            dist
            .maestro-artifacts
          include-hidden-files: true
          if-no-files-found: error

  maestro_android_apps:
    permissions:
      contents: read
      actions: write
    needs: maestro_web_assets
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Build Android Maestro app / ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - deferred
          - always
          - at-install
          - on-launch
          - manual-zip
          - manual-zip-no-persist
          - manual-zip-config-guards
          - manual-manifest
          - edge-deferred
          - edge-direct
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Download reusable Maestro web assets (attempt 1)
        id: download_maestro_web_assets_1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before retrying Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 2)
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        id: download_maestro_web_assets_2
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before final Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 3)
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Build Android app
        run: bun scripts/maestro/prepare-android-scenario.mjs "${{ matrix.scenario }}"
      - name: Upload Android app (attempt 1)
        id: upload_android_app_1
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-app-${{ matrix.scenario }}
          path: example-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Wait before retrying Android app upload
        if: steps.upload_android_app_1.outcome == 'failure'
        run: sleep 15
      - name: Upload Android app (attempt 2)
        if: steps.upload_android_app_1.outcome == 'failure'
        id: upload_android_app_2
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-app-${{ matrix.scenario }}
          overwrite: true
          path: example-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Wait before final Android app upload
        if: steps.upload_android_app_1.outcome == 'failure' && steps.upload_android_app_2.outcome == 'failure'
        run: sleep 15
      - name: Upload Android app (attempt 3)
        if: steps.upload_android_app_1.outcome == 'failure' && steps.upload_android_app_2.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-app-${{ matrix.scenario }}
          overwrite: true
          path: example-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  maestro_ios_apps:
    permissions:
      contents: read
      actions: write
    needs: maestro_web_assets
    timeout-minutes: 10
    runs-on: macOS-latest
    name: Build iOS Maestro apps
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Download reusable Maestro web assets (attempt 1)
        id: download_maestro_web_assets_1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before retrying Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 2)
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        id: download_maestro_web_assets_2
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before final Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 3)
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Build iOS app
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/maestro-ios-apps"
          derived_data_path="$RUNNER_TEMP/maestro-ios-derived"
          scenarios=(
            deferred
            always
            at-install
            on-launch
            manual-zip
            manual-zip-no-persist
            manual-zip-config-guards
            manual-manifest
          )

          rm -rf "$artifact_root" "$derived_data_path"
          mkdir -p "$artifact_root"

          for scenario in "${scenarios[@]}"; do
            app_artifact_path="$artifact_root/$scenario"
            bun scripts/maestro/prepare-ios-scenario.mjs "$scenario"
            xcodebuild \
              -project example-app/ios/App/App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath "$derived_data_path" \
              build
            mkdir -p "$app_artifact_path"
            ditto "$derived_data_path/Build/Products/Debug-iphonesimulator/App.app" "$app_artifact_path/App.app"
          done
      - name: Upload iOS apps
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-apps
          path: ${{ runner.temp }}/maestro-ios-apps
          if-no-files-found: error

  maestro_android_example_app:
    permissions:
      contents: read
      actions: write
    needs:
      - maestro_web_assets
      - maestro_android_apps
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Android example app Maestro smoke / ${{ matrix.scenario }}
    env:
      CAPGO_MAESTRO_SUCCESS_MARKER: ${{ github.workspace }}/maestro-android-smoke.pass
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - manual-zip
          - manual-zip-no-persist
          - manual-zip-config-guards
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Download reusable Maestro web assets
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Download Android app
        uses: actions/download-artifact@v8
        with:
          name: maestro-android-app-${{ matrix.scenario }}
          path: example-app/android/app/build/outputs/apk/debug
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Clear Android SDK temp cache
        shell: bash
        run: bash ./.github/scripts/ensure-android-emulator-sdk.sh
      # Same emulator teardown hazard as the live update job: bound the step below the job cap
      # and let the success marker decide the result.
      - name: Run Maestro smoke tests
        id: maestro_smoke_flow_1
        timeout-minutes: 10
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
