          - always
          - legacy-true
          - at-install
          - on-launch
          - manual-zip-config-guards
          - manual-manifest
        # Edge cases share one app build per app scenario and inject failures via the fake server.
        include:
          - scenario: edge-network-drop
            app: edge-deferred
          - scenario: edge-kill-download
            app: edge-deferred
          - scenario: edge-corrupt-bundle
            app: edge-deferred
          - scenario: edge-offline-check
            app: edge-deferred
          - scenario: edge-direct-network-drop
            app: edge-direct
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/bun.lock', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Download reusable Maestro web assets (attempt 1)
        id: download_maestro_web_assets_1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before retrying Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 2)
        if: steps.download_maestro_web_assets_1.outcome == 'failure'
        id: download_maestro_web_assets_2
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Wait before final Maestro web assets download
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        run: sleep 15
      - name: Download reusable Maestro web assets (attempt 3)
        if: steps.download_maestro_web_assets_1.outcome == 'failure' && steps.download_maestro_web_assets_2.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: maestro-web-assets
          path: .
      - name: Download Android app (attempt 1)
        id: download_android_app_1
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-android-app-${{ matrix.app || matrix.scenario }}
          path: example-app/android/app/build/outputs/apk/debug
      - name: Wait before retrying Android app download
        if: steps.download_android_app_1.outcome == 'failure'
        run: sleep 15
      - name: Download Android app (attempt 2)
        if: steps.download_android_app_1.outcome == 'failure'
        id: download_android_app_2
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: maestro-android-app-${{ matrix.app || matrix.scenario }}
          path: example-app/android/app/build/outputs/apk/debug
      - name: Wait before final Android app download
        if: steps.download_android_app_1.outcome == 'failure' && steps.download_android_app_2.outcome == 'failure'
        run: sleep 15
      - name: Download Android app (attempt 3)
        if: steps.download_android_app_1.outcome == 'failure' && steps.download_android_app_2.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: maestro-android-app-${{ matrix.app || matrix.scenario }}
          path: example-app/android/app/build/outputs/apk/debug
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Clear Android SDK temp cache
        shell: bash
        run: bash ./.github/scripts/ensure-android-emulator-sdk.sh
      - name: Run live update Maestro flow
        id: maestro_live_flow_1
        timeout-minutes: ${{ matrix.scenario == 'edge-corrupt-bundle' && 9 || 8 }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: >-
            CAPGO_MAESTRO_SKIP_BUILD=1
            CAPGO_MAESTRO_SKIP_BUNDLE_BUILD=1
            MAESTRO_FLOW_TIMEOUT_SECONDS=300
            CAPGO_MAESTRO_FLOW_RETRIES=2
            CAPGO_MAESTRO_SPLIT_RETRIES=2
            CAPGO_MAESTRO_UI_STATE_TIMEOUT_SECONDS=180
            CAPGO_MAESTRO_DIRECT_UPDATE_SETTLE_TIMEOUT_SECONDS=180
            bash ./scripts/maestro/run-android-live-update-ci.sh "${{ matrix.scenario }}"
      - name: Detect live update success marker after first attempt
        id: maestro_live_marker_1
        if: always() && steps.maestro_live_flow_1.outcome != 'skipped'
        run: |
          if [[ -f "$CAPGO_MAESTRO_SUCCESS_MARKER" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Clear Android SDK temp cache (retry)
        if: steps.maestro_live_flow_1.outcome == 'failure' && steps.maestro_live_marker_1.outputs.present != 'true'
        shell: bash
        run: bash ./.github/scripts/ensure-android-emulator-sdk.sh
      - name: Run live update Maestro flow (retry after emulator SDK flake)
        if: steps.maestro_live_flow_1.outcome == 'failure' && steps.maestro_live_marker_1.outputs.present != 'true'
        timeout-minutes: ${{ matrix.scenario == 'edge-corrupt-bundle' && 9 || 8 }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: >-
            CAPGO_MAESTRO_SKIP_BUILD=1
            CAPGO_MAESTRO_SKIP_BUNDLE_BUILD=1
            MAESTRO_FLOW_TIMEOUT_SECONDS=300
            CAPGO_MAESTRO_FLOW_RETRIES=2
            CAPGO_MAESTRO_SPLIT_RETRIES=2
            CAPGO_MAESTRO_UI_STATE_TIMEOUT_SECONDS=180
            CAPGO_MAESTRO_DIRECT_UPDATE_SETTLE_TIMEOUT_SECONDS=180
            bash ./scripts/maestro/run-android-live-update-ci.sh "${{ matrix.scenario }}"
      - name: Verify live update scenario passed
        run: |
          if [[ ! -f "$CAPGO_MAESTRO_SUCCESS_MARKER" ]]; then
            echo "Android live update Maestro scenario '${{ matrix.scenario }}' did not pass."
            exit 1
          fi
          echo "Android live update Maestro scenario '${{ matrix.scenario }}' passed."
      - name: Upload fake Capgo server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-server-log-${{ matrix.scenario }}
          path: .maestro-artifacts/fake-capgo-server.log
          if-no-files-found: ignore

  maestro_android:
    if: always()
    needs:
      - maestro_android_scenarios
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any live update scenario fails
        run: |
          if [[ "${{ needs.maestro_android_scenarios.result }}" != "success" ]]; then
            echo "One or more Android live update Maestro scenarios failed."
            exit 1
          fi
