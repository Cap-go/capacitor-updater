name: Bump version

on:
  push:
    branches:
      - main
      - development
      - v5
      - v6
      - v7
      - v9
    paths-ignore:
      - 'example-app/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  # Run all tests first before creating any tags
  test:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    # Called workflow jobs are capped at 10 minutes; never raise that unless explicitly asked.
    uses: ./.github/workflows/test.yml

  # Only bump version and create tag if all tests pass
  bump-version:
    needs: [test]
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    name: "Bump version and create tag"
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          token: '${{ secrets.PERSONAL_ACCESS_TOKEN }}'
      - name: Snapshot tags before bump
        run: |
          git tag -l | sort > "$RUNNER_TEMP/tags-before.txt"
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        id: install_code
        run: bun i
      - name: Git config
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
      - name: Update Doc
        run: bun run docgen
      - name: Add doc to github
        run: |
          git add README.md
          git add api.md
          git commit --m "docs: update doc" || true
      - name: Create version bump main
        if: github.ref == 'refs/heads/main'
        run: bunx capacitor-plugin-standard-version@2.0.19 --skip.changelog
      - name: Create version bump v9
        if: github.ref == 'refs/heads/v9'
        run: |
          set -euo pipefail
          MAJOR=$(node -p "require('./package.json').version.split('.')[0]")
          if [ "$MAJOR" -lt 9 ]; then
            bunx capacitor-plugin-standard-version@2.0.19 --release-as 9.0.0 --prerelease beta --skip.changelog
          else
            bunx capacitor-plugin-standard-version@2.0.19 --prerelease beta --skip.changelog
          fi
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            9.0.0-beta.*) echo "v9 prerelease $VERSION" ;;
            *) echo "Refusing to tag $VERSION on v9: only 9.0.0-beta.* is allowed"; exit 1 ;;
          esac
      - name: Create version bump development
        if: github.ref == 'refs/heads/development'
        run: bunx capacitor-plugin-standard-version@2.0.19 --prerelease alpha --skip.changelog
      - name: Tag existing version on LTS branches
        if: github.ref == 'refs/heads/v5' || github.ref == 'refs/heads/v6' || github.ref == 'refs/heads/v7'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          MAJOR=${VERSION%%.*}
          if [ "$GITHUB_REF" != "refs/heads/v${MAJOR}" ]; then
            echo "Ref $GITHUB_REF does not match package major $MAJOR"
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
            exit 0
          fi
          git tag "$VERSION"
      - name: Push to origin
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          remote_repo="https://${GITHUB_ACTOR}:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git diff --staged --quiet || git commit -m "chore: commit any remaining changes" || true
          git pull --rebase $remote_repo $CURRENT_BRANCH
          git push $remote_repo HEAD:$CURRENT_BRANCH
          # GitHub fires no tag push event when more than 3 tags arrive in one push, so push each new tag on its own.
          git tag -l | sort > "$RUNNER_TEMP/tags-after.txt"
          for t in $(comm -13 "$RUNNER_TEMP/tags-before.txt" "$RUNNER_TEMP/tags-after.txt"); do
            git push $remote_repo "refs/tags/$t"
          done
      - name: Push generated doc to doc repo
        if: github.ref == 'refs/heads/main'
        uses: nkoppel/push-files-to-another-repository@82da78d76ccb187ccaf0b8fde044c4153ab5d3e1 # v1.1.4
        env:
          API_TOKEN_GITHUB: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          source-files: api.md
          destination-username: Cap-go
          destination-repository: website
          destination-directory: src/content/docs/docs/plugin
          destination-branch: main
          commit-email: martindonadieu@gmail.com
