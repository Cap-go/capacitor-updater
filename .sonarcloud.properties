# Capgo v2 checksum recovery requires raw RSA (.rsaEncryptionRaw) for Node privateEncrypt
# compatibility. Sonar swift:S5542 false-positives on that intentional wire format; Swift has
# no // NOSONAR support under automatic analysis.
sonar.issue.ignore.multicriteria=capgoRawRsa
sonar.issue.ignore.multicriteria.capgoRawRsa.ruleKey=swift:S5542
sonar.issue.ignore.multicriteria.capgoRawRsa.resourceKey=ios/Sources/CapacitorUpdaterPlugin/CapgoRawRsa.swift
# Org CI bar: GitHub Actions use latest major tags (@vN), never SHA pins. githubactions:S7637
# conflicts with that policy, so workflow files are excluded from Sonar analysis.
sonar.exclusions=.github/workflows/**
